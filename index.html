<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MENÚ EL MICHI 🐱</title>
<style>
:root{
  --bg1:#0f172a;
  --bg2:#111827;
  --card:rgba(255,255,255,.14);
  --line:rgba(255,255,255,.18);
  --text:#f8fafc;
  --muted:rgba(248,250,252,.78);
  --shadow:0 18px 50px rgba(0,0,0,.28);
  --radius:28px;
  --accent:#60a5fa;
  --good:#22c55e;
  --warn:#f59e0b;
  --bad:#ef4444;
  --glass-blur:blur(18px);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  font-family:Inter, "Segoe UI", Arial, sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 15% 15%, rgba(96,165,250,.28), transparent 26%),
    radial-gradient(circle at 85% 12%, rgba(34,197,94,.20), transparent 22%),
    radial-gradient(circle at 20% 85%, rgba(245,158,11,.16), transparent 24%),
    linear-gradient(160deg, #08111f 0%, #0b1220 35%, #0f172a 100%);
  background-attachment:fixed;
  padding:10px;
  overflow-x:hidden;
}

body::before{
  content:"";
  position:fixed;
  inset:-30%;
  background:
    radial-gradient(circle at 30% 30%, rgba(255,255,255,.05), transparent 20%),
    radial-gradient(circle at 70% 70%, rgba(255,255,255,.04), transparent 18%);
  filter:blur(30px);
  pointer-events:none;
  z-index:0;
}

body::after{
  content:"";
  position:fixed;
  inset:0;
  background-image: radial-gradient(rgba(255,255,255,.08) 1px, transparent 1px);
  background-size:24px 24px;
  opacity:.12;
  pointer-events:none;
  z-index:0;
}

.container{
  position:relative;
  z-index:1;
  max-width:760px;
  margin:0 auto;
  padding:10px;
  background:linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.08));
  border:1px solid var(--line);
  border-radius:32px;
  box-shadow:var(--shadow);
  backdrop-filter:var(--glass-blur);
  -webkit-backdrop-filter:var(--glass-blur);
}

.hero{
  padding:14px;
  border-radius:24px;
  background:
    linear-gradient(135deg, rgba(255,255,255,.16), rgba(255,255,255,.08)),
    radial-gradient(circle at top right, rgba(96,165,250,.35), transparent 35%);
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 10px 30px rgba(0,0,0,.20), inset 0 1px 0 rgba(255,255,255,.08);
  position:relative;
  overflow:hidden;
}

.hero::before{
  content:"";
  position:absolute;
  width:180px;
  height:180px;
  background:rgba(255,255,255,.06);
  border-radius:50%;
  top:-80px;
  right:-80px;
  filter:blur(10px);
}

.hero-top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:14px;
  flex-wrap:wrap;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  width:48px;
  height:48px;
  border-radius:16px;
  display:grid;
  place-items:center;
  font-size:24px;
  background:linear-gradient(135deg,#60a5fa,#2563eb);
  color:white;
  box-shadow:0 0 20px rgba(96,165,250,.45), 0 8px 18px rgba(0,0,0,.20);
  animation:float 3s ease-in-out infinite;
}

@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-4px)}
}

.brand h1{
  font-size:22px;
  line-height:1;
  font-weight:900;
  letter-spacing:.5px;
  background:linear-gradient(90deg,#fff,#93c5fd);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.subtitle{
  color:rgba(255,255,255,.75);
  margin-top:4px;
  font-size:12px;
  line-height:1.4;
}

.badges{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  justify-content:flex-end;
}

.badge{
  padding:8px 11px;
  border-radius:999px;
  font-size:11px;
  font-weight:800;
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.15);
  color:var(--text);
  box-shadow:0 8px 20px rgba(0,0,0,.10);
  white-space:nowrap;
}

.section{
  margin-top:12px;
  padding:14px;
  border-radius:26px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);
}

.section-title{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:12px;
  margin-bottom:12px;
}

.section-title h2{
  font-size:18px;
  color:var(--text);
  letter-spacing:.2px;
}

.section-title span{
  font-size:12px;
  color:var(--muted);
}

input,select,button{
  font:inherit;
}

input,select{
  width:100%;
  padding:10px 12px;
  margin:7px 0;
  border:none;
  border-radius:18px;
  font-size:16px;
  color:#0f172a;
  background:rgba(255,255,255,.94);
  outline:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45);
  transition:transform .2s ease, box-shadow .2s ease, background .2s ease;
}

input:focus,select:focus{
  transform:translateY(-1px);
  box-shadow:0 0 0 4px rgba(96,165,250,.20), inset 0 1px 0 rgba(255,255,255,.45);
}

button{
  width:100%;
  padding:10px 12px;
  margin:6px 0;
  border:none;
  border-radius:18px;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  color:#0f172a;
  transition:transform .18s ease, filter .18s ease, box-shadow .18s ease, opacity .18s ease;
  box-shadow:0 10px 24px rgba(0,0,0,.12);
  position:relative;
  overflow:hidden;
}

button:hover{ transform:translateY(-1px); filter:saturate(1.06); }
button:active{ transform:translateY(0) scale(.99); opacity:.96; }

.crepas{background:linear-gradient(135deg,#ffe082,#ffca28)}
.platanos{background:linear-gradient(135deg,#ffd180,#ffab40)}
.papas{background:linear-gradient(135deg,#ffab91,#ff8a65)}
.hamb{background:linear-gradient(135deg,#ffccbc,#ffab91)}
.hot{background:linear-gradient(135deg,#c5e1a5,#9ccc65)}
.frap{background:linear-gradient(135deg,#80deea,#4dd0e1)}

.guardar{background:linear-gradient(135deg,#4ade80,#22c55e);color:white}
.eliminar{background:linear-gradient(135deg,#fb7185,#ef4444);color:white}
.vaciar{background:linear-gradient(135deg,#fda4af,#f87171);color:white}

.quick-actions{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.quick-actions button{
  padding:13px 12px;
  font-size:14px;
}

#estadoUbicacion{
  background:rgba(255,255,255,.90);
  color:#0f172a;
  padding:12px 14px;
  border-radius:18px;
  margin:10px 0 8px;
  font-size:14px;
  line-height:1.45;
  border:1px solid rgba(15,23,42,.06);
}

#carrito, #historialPedidos{
  background:rgba(255,255,255,.95);
  color:#0f172a;
  padding:12px;
  border-radius:24px;
  margin:12px 0;
  max-height:520px;
  overflow-y:auto;
  overflow-x:hidden;
  min-height:140px;
  border:1px solid rgba(15,23,42,.08);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55);
  scroll-behavior:smooth;
}

#carrito p{
  padding:12px 12px;
  margin:0 0 8px 0;
  border-radius:16px;
  cursor:pointer;
  background:linear-gradient(180deg, #ffffff, #f8fafc);
  border:1px solid rgba(15,23,42,.06);
  transition:transform .15s ease, background .15s ease, border-color .15s ease;
  line-height:1.35;
}

#carrito p:hover{
  transform:translateY(-1px);
  background:#eff6ff;
  border-color:#bfdbfe;
}

.selected{
  background:linear-gradient(180deg, #dcfce7, #bbf7d0) !important;
  border:2px solid #22c55e !important;
}

#total{
  text-align:center;
  font-size:clamp(26px, 5vw, 34px);
  font-weight:900;
  color:#fff;
  margin:14px 0 10px;
  text-shadow:0 6px 18px rgba(0,0,0,.22);
}

.modal{
  position:fixed;
  inset:0;
  display:none;
  overflow:auto;
  background:rgba(2,6,23,.52);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  z-index:50;
}

.modal-content{
  width:min(720px, calc(100% - 24px));
  margin:18px auto;
  padding:10px;
  background:linear-gradient(180deg, rgba(255,255,255,.98), rgba(248,250,252,.98));
  color:#0f172a;
  border-radius:30px;
  box-shadow:0 24px 60px rgba(0,0,0,.30);
  border:1px solid rgba(255,255,255,.60);
}

.top-bar{
  display:flex;
  gap:10px;
  justify-content:space-between;
}

.top-bar button{
  width:50%;
  background:linear-gradient(135deg,#e0f2fe,#bfdbfe);
  color:#0f172a;
  box-shadow:none;
  border:1px solid rgba(96,165,250,.20);
}

#titulo{
  text-align:center;
  margin:16px 0 14px;
  font-size:24px;
  font-weight:900;
}

#ops{
  display:grid;
  gap:10px;
}

#ops label{
  display:flex;
  align-items:center;
  gap:10px;
  padding:14px 14px;
  background:#f8fafc;
  border:1px solid rgba(15,23,42,.08);
  border-radius:18px;
  cursor:pointer;
}

#ops input{
  width:auto;
  margin:0;
  accent-color:#2563eb;
  box-shadow:none;
}

.modal .next-btn{
  margin-top:14px;
  background:linear-gradient(135deg,#60a5fa,#3b82f6);
  color:white;
}

.toast-wrap{
  position:fixed;
  right:16px;
  bottom:16px;
  z-index:90;
  display:grid;
  gap:10px;
  width:min(92vw, 360px);
  pointer-events:none;
}

.toast{
  pointer-events:none;
  background:rgba(15,23,42,.92);
  color:#fff;
  padding:10px 12px;
  border-radius:18px;
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 18px 40px rgba(0,0,0,.24);
  transform:translateY(8px);
  opacity:0;
  animation:toastIn .22s ease forwards;
  font-size:14px;
  line-height:1.35;
}

.toast.good{border-left:5px solid var(--good)}
.toast.warn{border-left:5px solid var(--warn)}
.toast.bad{border-left:5px solid var(--bad)}

@keyframes toastIn{ to{opacity:1;transform:translateY(0)} }

.history-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.history-header small{
  color:rgba(255,255,255,.75);
}

.pedido-card{
  padding:12px;
  border-radius:18px;
  background:linear-gradient(180deg, #ffffff, #f8fafc);
  border:1px solid rgba(15,23,42,.08);
  margin-bottom:10px;
}

.pedido-card.pendiente{border-left:6px solid #94a3b8}
.pedido-card.preparando{border-left:6px solid #f59e0b; background:linear-gradient(180deg,#fff7ed,#ffffff)}
.pedido-card.pagado{border-left:6px solid #0ea5e9; background:linear-gradient(180deg,#ecfeff,#ffffff)}
.pedido-card.entregado{border-left:6px solid #22c55e; background:linear-gradient(180deg,#f0fdf4,#ffffff)}

.pedido-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
  align-items:flex-start;
}

.pedido-title{
  font-weight:900;
  color:#0f172a;
  margin-bottom:4px;
}

.pedido-meta{
  font-size:12px;
  color:#475569;
  margin-bottom:6px;
}

.pedido-precio{
  font-size:28px;
  font-weight:950;
  color:#0f172a;
  line-height:1;
  margin-bottom:4px;
}

.pedido-items{
  white-space:pre-wrap;
  font-size:13px;
  line-height:1.45;
  color:#0f172a;
  background:#f8fafc;
  border:1px dashed #cbd5e1;
  border-radius:14px;
  padding:10px;
  margin:8px 0 10px;
}

.estado-chip{
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-size:12px;
  font-weight:900;
  padding:6px 10px;
  border-radius:999px;
  color:#0f172a;
  background:#e2e8f0;
}

.estado-chip.preparando{background:#fef3c7}
.estado-chip.pagado{background:#e0f2fe}
.estado-chip.entregado{background:#dcfce7}

.pedido-actions{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
}

.pedido-actions button{
  font-size:12px;
  padding:10px 8px;
  margin:0;
  border-radius:14px;
}

.btn-editar{background:linear-gradient(135deg,#e0f2fe,#bfdbfe)}
.btn-preparando{background:linear-gradient(135deg,#fde68a,#f59e0b)}
.btn-pagado{background:linear-gradient(135deg,#bae6fd,#0ea5e9)}
.btn-entregado{background:linear-gradient(135deg,#bbf7d0,#22c55e); color:white}

@media (max-width:640px){
  body{padding:10px}
  .container{padding:12px;border-radius:26px}
  .hero{padding:14px}
  .hero-top{flex-direction:column;align-items:flex-start}
  .badges{justify-content:flex-start}
  .quick-actions{grid-template-columns:1fr}
  .section{padding:14px}
  .modal-content{width:calc(100% - 14px);padding:10px;border-radius:24px;margin:10px auto}
  .top-bar{flex-direction:column}
  .top-bar button{width:100%}
  .pedido-actions{grid-template-columns:1fr 1fr}
  button{font-size:15px}

  #historialPedidos{
    max-height:75vh;
    min-height:240px;
    padding:14px;
    border-radius:22px;
  }

  .pedido-card{
    padding:14px;
    border-radius:20px;
  }

  .pedido-items{
    font-size:14px;
    line-height:1.55;
    padding:12px;
  }

  .pedido-actions{
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  .pedido-actions button{
    padding:12px 10px;
    font-size:13px;
  }

  .pedido-title{
    font-size:16px;
  }

  .pedido-meta{
    font-size:13px;
  }

  .pedido-precio{
    font-size:30px;
  }
}
</style>
</head>
<body>

<div class="container">
  <div class="hero">
    <div class="hero-top">
      <div class="brand">
        <div class="logo">🐱</div>
        <div>
          <h1>MENÚ EL MICHI</h1>
          <div class="subtitle">Pedidos, carrito y seguimiento</div>
        </div>
      </div>
      <div class="badge">🧾 Pedidos</div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">
      <h2>🚚 Pedido</h2>
      <span>Agrega productos al carrito</span>
    </div>

    <p style="background:rgba(255,255,255,.9);color:#0f172a;padding:12px 14px;border-radius:18px;margin:10px 0 8px;font-size:14px;line-height:1.45;border:1px solid rgba(15,23,42,.06);">
      📦 El pedido se guardará en el historial cuando presiones <b>Guardar pedido</b>
    </p>

    <div class="quick-actions">
      <button class="crepas" onclick="crepas()">🥞 Crepas</button>
      <button class="platanos" onclick="platanos()">🍌 Plátanos</button>
      <button class="papas" onclick="papas()">🍟 Papas</button>
    </div>
    <div class="quick-actions" style="margin-top:10px;">
      <button class="hamb" onclick="hamb()">🍔 Hamburguesas</button>
      <button class="hot" onclick="hot()">🌭 Hot Dogs</button>
      <button class="frap" onclick="frap()">🥤 Frappés</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">
      <h2>🛒 Carrito</h2>
      <span>Toca un producto para seleccionarlo</span>
    </div>

    <div id="carrito"></div>
    <div id="total">Total: $0</div>

    <button class="guardar" onclick="guardarPedido()">💾 Guardar pedido</button>
    <button class="eliminar" onclick="eliminar()">❌ Eliminar seleccionado</button>
    <button class="vaciar" onclick="vaciar()">🗑 Vaciar todo</button>
  </div>

  <div class="section">
    <div class="history-header">
      <div>
        <div class="section-title" style="margin-bottom:4px;">
          <h2>📋 Pedidos guardados</h2>
          <span>Pedidos guardados</span>
        </div>
        <small id="historialInfo">Sin pedidos guardados</small>
      </div>
    </div>
    <div id="historialPedidos"></div>
  </div>
</div>

<div id="modal" class="modal">
  <div class="modal-content">
    <div class="top-bar">
      <button onclick="back()">⬅ Atrás</button>
      <button onclick="cerrar()">❌ Cerrar</button>
    </div>
    <h3 id="titulo"></h3>
    <div id="ops"></div>
    <button class="next-btn" onclick="next()">Siguiente ➡️</button>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script>
let carrito = [];
let seleccionado = null;
let paso = 0;
let flujo = [];
let data = {};
let maxSel = null;
let editingOrderId = null;

const HISTORY_KEY = "michi_historial_pedidos_v2";
const HISTORY_RESET_KEY = "michi_historial_reset_v2";
const HISTORY_DURATION_MS = 12 * 60 * 60 * 1000;

let audioCtx = null;

function getAudioCtx(){
  if(!audioCtx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    audioCtx = new AC();
  }
  if(audioCtx.state === "suspended"){
    audioCtx.resume().catch(()=>{});
  }
  return audioCtx;
}

function playTone(freq, duration=0.09, type="sine", volume=0.03, ramp=0.015, delay=0){
  const ctx = getAudioCtx();
  if(!ctx) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  const start = ctx.currentTime + delay;
  osc.type = type;
  osc.frequency.setValueAtTime(freq, start);
  gain.gain.setValueAtTime(0.0001, start);
  gain.gain.exponentialRampToValueAtTime(volume, start + ramp);
  gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(start);
  osc.stop(start + duration + 0.02);
}

function soundTap(){ playTone(760, 0.06, "sine", 0.018, 0.012); }
function soundOpen(){ playTone(520, 0.08, "sine", 0.020, 0.015); playTone(660, 0.08, "sine", 0.018, 0.015, 0.06); }
function soundAdd(){ playTone(523.25, 0.08, "triangle", 0.022, 0.012); playTone(659.25, 0.09, "triangle", 0.020, 0.012, 0.07); playTone(783.99, 0.10, "triangle", 0.018, 0.012, 0.15); }
function soundSuccess(){ playTone(392, 0.10, "sine", 0.020, 0.015); playTone(523.25, 0.12, "sine", 0.020, 0.015, 0.10); playTone(659.25, 0.14, "sine", 0.020, 0.015, 0.22); }
function soundDelete(){ playTone(370, 0.11, "sine", 0.018, 0.015); playTone(247, 0.12, "sine", 0.016, 0.015, 0.08); }
function soundError(){ playTone(330, 0.12, "sine", 0.018, 0.015); playTone(247, 0.16, "sine", 0.016, 0.10); }

document.addEventListener("click",(e)=>{
  if(e.target.tagName==="BUTTON") soundTap();
});

function toast(msg,type="good"){
  if(type==="good") soundSuccess();
  if(type==="bad" || type==="warn") soundError();
  const wrap=document.getElementById("toastWrap");
  const el=document.createElement("div");
  el.className=`toast ${type}`;
  el.textContent=msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity="0"; el.style.transform="translateY(8px)"; }, 2600);
  setTimeout(()=>{ el.remove(); }, 3200);
}

const nativeAlert = window.alert.bind(window);
window.alert = function(msg){
  soundError();
  nativeAlert(msg);
};

function nowDateTime(){
  const d = new Date();
  const fecha = new Intl.DateTimeFormat("es-MX", {
    dateStyle: "full",
    timeStyle: "short"
  }).format(d);
  return { iso: d.toISOString(), fecha };
}

function getHistory(){
  ensureHistoryFresh();
  try{
    return JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
  }catch{
    return [];
  }
}

function setHistory(history){
  localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
}

function getResetTimestamp(){
  const raw = localStorage.getItem(HISTORY_RESET_KEY);
  const ts = raw ? Number(raw) : 0;
  return Number.isFinite(ts) ? ts : 0;
}

function setResetTimestamp(ts){
  localStorage.setItem(HISTORY_RESET_KEY, String(ts));
}

function ensureHistoryFresh(){
  const now = Date.now();
  const resetTs = getResetTimestamp();
  if(!resetTs){
    setResetTimestamp(now);
    return;
  }
  if(now - resetTs >= HISTORY_DURATION_MS){
    localStorage.removeItem(HISTORY_KEY);
    setResetTimestamp(now);
    toast("Se limpió el historial automático de 12 horas", "warn");
  }
}

function saveOrder(order){
  const history = getHistory();
  if(editingOrderId !== null){
    const idx = history.findIndex(p => p.id === editingOrderId);
    if(idx !== -1){
      history[idx] = order;
    }else{
      history.unshift(order);
    }
    editingOrderId = null;
  }else{
    history.unshift(order);
  }
  setHistory(history);
  renderHistory();
}

function updateOrderById(id, updater){
  const history = getHistory();
  const idx = history.findIndex(p => p.id === id);
  if(idx === -1) return;
  history[idx] = updater({...history[idx]});
  setHistory(history);
  renderHistory();
}

function escapeHtml(str){
  return String(str)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;");
}

function estadoTexto(input){
  if(typeof input === "string"){
    switch(input){
      case "preparando": return "Preparando";
      case "finalizado": return "Finalizado";
      case "pagado": return "Pagado";
      case "entregado": return "Entregado";
      default: return "Pendiente";
    }
  }

  const pedido = input || {};
  const estados = [];

  if(pedido.pagado){
    estados.push("Pagado");
  }

  if(pedido.estado === "preparando"){
    estados.push("Preparando");
  }else if(pedido.estado === "entregado"){
    estados.push("Entregado");
  }else if(pedido.estado === "finalizado"){
    estados.push("Finalizado");
  }

  if(estados.length === 0){
    return "Pendiente";
  }

  return estados.join(" • ");
}

function renderHistory(){
  ensureHistoryFresh();
  const history = getHistory();
  const box = document.getElementById("historialPedidos");
  const info = document.getElementById("historialInfo");

  info.textContent = history.length ? `${history.length} pedido(s) guardado(s)` : "Sin pedidos guardados";

  if(!history.length){
    box.innerHTML = `
      <div style="text-align:center;padding:22px 10px;color:#475569;">
        <div style="font-size:34px;">📋</div>
        <div style="font-weight:800;margin-top:8px;">Sin pedidos guardados</div>
        <div style="font-size:13px;margin-top:4px;">Tus pedidos guardados aparecerán aquí</div>
      </div>
    `;
    return;
  }

  box.innerHTML = history.map((pedido, idx) => {
    const status = pedido.estado || "pendiente";
    return `
      <div class="pedido-card ${status}">
        <div class="pedido-top">
          <div>
            <div class="pedido-title">🧾 Pedido #${history.length - idx}</div>
            <div class="pedido-meta">🕒 ${escapeHtml(pedido.fechaHora || "")}</div>
            <div class="pedido-precio">💰 $${escapeHtml(String(pedido.total ?? 0))}</div>
          </div>
          <div class="estado-chip ${status}">● ${estadoTexto(pedido)}</div>
        </div>

        <div class="pedido-items">${escapeHtml(pedido.detalles || pedido.resumen || "")}</div>

        <div class="pedido-actions">
          <button class="btn-editar" onclick="editarPedido(${pedido.id})">Editar</button>
          <button class="btn-preparando" onclick="cambiarEstado(${pedido.id}, 'preparando')">Preparando</button>
          ${pedido.pagado ? "" : `<button class="btn-pagado" onclick="cambiarEstado(${pedido.id}, 'pagado')">Pagado</button>`}
          <button class="btn-entregado" onclick="cambiarEstado(${pedido.id}, 'entregado')">Entregado</button>
        </div>
      </div>
    `;
  }).join("");
}

function cambiarEstado(id, estado){
  updateOrderById(id, pedido => {
    if(estado === "pagado"){
      pedido.pagado = true;
    }else{
      pedido.estado = estado;
    }
    return pedido;
  });

  if(estado === "pagado"){
    toast("Pedido marcado como pagado");
  }else{
    toast(`Pedido marcado como ${estadoTexto(estado).toLowerCase()}`);
  }
}

function editarPedido(id){
  const history = getHistory();
  const pedido = history.find(p => p.id === id);
  if(!pedido) return;

  carrito = Array.isArray(pedido.items)
    ? pedido.items.map(i => ({...i}))
    : [];

  seleccionado = null;
  editingOrderId = id;
  render();
  toast("Pedido cargado al carrito para editar");
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function actualizarResumen(){
  document.getElementById("total").innerText = "Total: $" + totalCarrito();
}

function setCategoria(cat){
  soundOpen();
  document.getElementById("modal").className = "modal " + cat;
  document.getElementById("modal").style.display = "block";
}

function getEmoji(nombre){
  nombre = nombre.toLowerCase();
  if(nombre.includes("hot dog") || nombre.includes("hotdog")) return "🌭";
  if(nombre.includes("hamburguesa") || nombre.includes("clásica") || nombre.includes("hawaiana") || nombre.includes("especial")) return "🍔";
  if(nombre.includes("crepa")) return "🥞";
  if(nombre.includes("plátanos") || nombre.includes("platano")) return "🍌";
  if(nombre.includes("papas") || nombre.includes("salchipulpos") || nombre.includes("banderilla")) return "🍟";
  if(nombre.includes("frappé") || nombre.includes("frappe")) return "🥤";
  return "🍽️";
}

function abrir(titulo,ops,tipo,max=null){
  document.getElementById("titulo").innerText=titulo;
  maxSel=max;
  let html="";
  ops.forEach(o=>{
    html+=`
      <label>
        <input type="${tipo}" name="opcion" value="${o}" onclick="control(this)">
        <span>${o}</span>
      </label>
    `;
  });
  document.getElementById("ops").innerHTML=html;
}

function cerrar(){
  document.getElementById("modal").style.display="none";
}

function back(){
  if(paso>0){
    paso--;
    flujo[paso]();
  }
}

function getSel(){
  return [...document.querySelectorAll("#ops input:checked")].map(i=>i.value);
}

function control(input){
  let checks=document.querySelectorAll("#ops input");
  if(input.value==="Ninguna" || input.value==="Ninguno" || input.value==="Con Todo"){
    if(input.checked){
      checks.forEach(c=>{ if(c!==input) c.checked=false; });
    }
  }else{
    checks.forEach(c=>{
      if(c.value==="Ninguna" || c.value==="Ninguno" || c.value==="Con Todo") c.checked=false;
    });
  }
  if(maxSel && getSel().length>maxSel){
    input.checked=false;
    toast("Solo puedes elegir el máximo permitido.", "warn");
  }
}

function next(){
  let sel=getSel();
  if(!sel.length){
    alert("Selecciona algo");
    return;
  }
  data[flujo[paso].key]=sel;
  paso++;
  if(paso<flujo.length){
    flujo[paso]();
  }else{
    cerrar();
    flujo.fin();
  }
}

function add(txt,precio){
  soundAdd();
  carrito.push({ nombre:txt, precio });
  render();
  actualizarResumen();
  toast("Producto agregado al carrito");
}

function render(){
  let div=document.getElementById("carrito");
  div.innerHTML="";
  let total=0;

  if(carrito.length===0){
    div.innerHTML = `
      <div style="text-align:center;padding:22px 10px;color:#475569;">
        <div style="font-size:34px;">🛒</div>
        <div style="font-weight:800;margin-top:8px;">Tu carrito está vacío</div>
        <div style="font-size:13px;margin-top:4px;">Agrega productos para armar tu pedido</div>
      </div>
    `;
  }else{
    carrito.forEach((i,idx)=>{
      let emoji=getEmoji(i.nombre);
      div.innerHTML += `
        <p onclick="seleccionar(${idx})" class="${seleccionado===idx?'selected':''}">
          ${emoji} ${i.nombre.replace(/\n/g,"<br>")}
        </p>
      `;
      total += i.precio;
    });
  }
  document.getElementById("total").innerText = "Total: $" + total;
}

function seleccionar(i){
  seleccionado=i;
  render();
}

function eliminar(){
  if(seleccionado!=null){
    carrito.splice(seleccionado,1);
    seleccionado=null;
    render();
    toast("Producto eliminado", "bad");
  }else{
    toast("Selecciona un producto primero", "warn");
  }
}

function vaciar(){
  carrito=[];
  seleccionado=null;
  render();
  toast("Carrito vaciado");
}

function totalCarrito(){
  return carrito.reduce((acc,item)=>acc+item.precio,0);
}

function verificarEntrega(){}

/* CREPAS */
function crepas(){
  setCategoria("crepas");
  paso=0; data={};
  flujo=[
    ()=>abrir("Bases",["Nutella","Lechera","Cajeta","Queso Philadelphia","Mermelada de fresa","Mermelada de zarzamora"],"checkbox",2),
    ()=>abrir("Frutas",["Fresa","Plátano","Durazno","Uva","Ninguna"],"checkbox"),
    ()=>abrir("Decoración",["Chocolate Hershey's","Lechera","Ninguna"],"radio"),
    ()=>abrir("Toppings",["Granillo de chocolate","Granillo de arcoiris","Gotas de chocolate","Nuez","Lunetitas","Ninguno"],"radio")
  ];
  flujo[0].key="bases"; flujo[1].key="frutas"; flujo[2].key="dec"; flujo[3].key="top";
  flujo.fin=function(){
    let b=data.bases||[];
    let f=(data.frutas||[]).filter(x=>x!="Ninguna");
    if(b.length>=2 && f.length>=4){
      alert("⚠️ PARA LA CREPA FRUTAL PUEDE LLEVAR MÁXIMO 1 BASE");
      paso=0; data={}; flujo[0](); return;
    }
    let nb=b.length, nf=f.length, precio=30;
    if(nb==1 && nf==1) precio=40;
    else if(nb==2 && nf==0) precio=35;
    else if((nb==1 && nf==2) || (nb==2 && nf==1)) precio=45;
    else if(nb>=1 && nf>=3) precio=50;
    else if(nb>=2 && nf>=2) precio=50;
    let txt="Crepa\nBase: "+b.join(", ");
    if(f.length) txt+="\nFruta: "+f.join(", ");
    if(data.dec && data.dec[0]!="Ninguna") txt+="\nDecoración: "+data.dec;
    if(data.top && data.top[0]!="Ninguno") txt+="\nToppings: "+data.top;
    txt+="\nPrecio: $"+precio;
    add(txt,precio);
  };
  flujo[0]();
}

/* PLATANOS */
function platanos(){
  setCategoria("platanos");
  paso=0; data={};
  flujo=[
    ()=>abrir("Tipo",["Fritos - $30","Árabes - $40"],"radio"),
    ()=>abrir("Complementos",["Crema","Lechera","Mermelada de fresa","Ninguna"],"checkbox"),
    ()=>abrir("Toppings",["Granillo de chocolate","Granillo de arcoiris","Gotas de chocolate","Nuez","Lunetitas","Ninguno"],"radio")
  ];
  flujo[0].key="tipo"; flujo[1].key="comp"; flujo[2].key="top";
  flujo.fin=function(){
    let precio=data.tipo[0].includes("30")?30:40;
    let txt="Plátanos "+data.tipo[0].split(" - ")[0];
    if(data.comp && !data.comp.includes("Ninguna")) txt+="\nComplementos: "+data.comp.join(", ");
    if(data.top && !data.top.includes("Ninguno")) txt+="\nToppings: "+data.top;
    txt+="\nPrecio: $"+precio;
    add(txt,precio);
  };
  flujo[0]();
}

/* PAPAS */
function papas(){
  setCategoria("papas");
  paso=0; data={};
  flujo=[
    ()=>abrir("Tipo",["Papas a la francesa - $35","Salchipulpos con papas - $45","Banderilla con papas - $35","Banderilla sola - $25"],"radio"),
    ()=>abrir("Aderezos",["Catsup","Queso amarillo","Salsa","Ninguna"],"checkbox")
  ];
  flujo[0].key="tipo"; flujo[1].key="ad";
  flujo.fin=function(){
    let precio=parseInt(data.tipo[0].match(/\d+/)[0]);
    let txt=data.tipo[0].split(" - ")[0];
    if(data.ad && !data.ad.includes("Ninguna")) txt+="\nAderezos: "+data.ad.join(", ");
    txt+="\nPrecio: $"+precio;
    add(txt,precio);
  };
  flujo[0]();
}

/* HAMBURGUESAS */
function hamb(){
  setCategoria("hamb");
  paso=0; data={};
  flujo=[
    ()=>abrir("Tipo de Hamburguesa",["Clásica - $55","Hawaiana - $60","Especial - $65"],"radio"),
    ()=>abrir("Omitir ingredientes",["Jamón","Queso amarillo","Queso Oaxaca","Chiles en vinagre","Jitomate","Cebolla","Lechuga","Mayonesa","Mostaza","Catsup","Con Todo"],"checkbox"),
    ()=>abrir("Extras",["Piña $8","Tocino $8","Salchicha $8","Carne $10","Ninguna"],"checkbox"),
    ()=>abrir("¿Con papas o sin papas?",["Con papas (+$10)","Sin papas"],"radio"),
    ()=>{
      if(data.papas[0].includes("Con papas")){
        abrir("Aderezos de papas",["Catsup","Queso amarillo","Salsa","Ninguna"],"checkbox");
      }else{
        data.aderezos=["Ninguna"];
        cerrar();
        flujo.fin();
      }
    }
  ];
  flujo[0].key="tipo"; flujo[1].key="sin"; flujo[2].key="extra"; flujo[3].key="papas"; flujo[4].key="aderezos";
  flujo.fin=function(){
    let precio=parseInt(data.tipo[0].match(/\d+/)[0]);
    if(data.papas[0].includes("Con papas")) precio+=10;
    (data.extra||[]).forEach(e=>{ if(e.includes("$")) precio+=parseInt(e.split("$")[1]); });
    let nombreHamb=data.tipo[0].split(" - ")[0];
    let txt="Hamburguesa "+nombreHamb;
    txt+=data.papas[0].includes("Con papas") ? "\nCon papas" : "\nSin papas";
    if(data.sin){
      if(data.sin.includes("Con Todo")) txt+="\nIngredientes: Con todo";
      else txt+="\nSin: "+data.sin.join(", ");
    }
    if(data.extra){
      if(data.extra.includes("Ninguna")) txt+="\nExtras: Ninguna";
      else txt+="\nExtras: "+data.extra.join(", ");
    }
    if(data.papas[0].includes("Con papas")){
      if(data.aderezos){
        if(data.aderezos.includes("Ninguna")) txt+="\nAderezos papas: Ninguna";
        else txt+="\nAderezos papas: "+data.aderezos.join(", ");
      }
    }
    txt+="\nPrecio: $"+precio;
    add(txt,precio);
  };
  flujo[0]();
}

/* HOT DOGS */
function hot(){
  setCategoria("hot");
  paso=0; data={};
  flujo=[
    ()=>abrir("Tipo",["Sencillo","Especiales"],"radio"),
    ()=> data.tipo[0]==="Especiales"
      ? abrir("¿Qué cantidad?",["1 $25","2 $50","3 $70"],"radio")
      : abrir("¿Qué cantidad?",["1 $20","2 $40","3 $55"],"radio"),
    ()=>abrir("Omitir ingredientes",["Mayonesa","Catsup","Jitomate","Chile jalapeño","Cebolla","Con Todo"],"checkbox")
  ];
  flujo[0].key="tipo"; flujo[1].key="cant"; flujo[2].key="sin";
  flujo.fin=function(){
    let cantidad=parseInt(data.cant[0]);
    let precio=parseInt(data.cant[0].match(/\d+/g).pop());
    let txt=`Hot Dog ${data.tipo[0]} x${cantidad}`;
    if(data.sin){
      if(data.sin.includes("Con Todo")) txt+="\nCon todo";
      else txt+="\nSin: "+data.sin.join(", ");
    }
    txt+="\nPrecio: $"+precio;
    add(txt,precio);
  };
  flujo[0]();
}

/* FRAPPES */
function frap(){
  setCategoria("frap");
  paso=0; data={};
  flujo=[
    ()=>abrir("Tipo",["Galleta Oreo","Mazapán","Frapuccino","Fresa"],"radio"),
    ()=> data.tipo[0]==="Fresa"
      ? abrir("Tamaño",["Chico $35","Grande $60"],"radio")
      : abrir("Tamaño",["Chico $30","Grande $50"],"radio")
  ];
  flujo[0].key="tipo"; flujo[1].key="tam";
  flujo.fin=function(){
    let precio=parseInt(data.tam[0].match(/\d+/)[0]);
    let tamaño=data.tam[0].split(" $")[0];
    let txt=`Frappé ${data.tipo[0]} (${tamaño})`;
    txt+=`\nPrecio: $${precio}`;
    add(txt,precio);
  };
  flujo[0]();
}

async function guardarPedido(){
  soundTap();

  if(carrito.length===0){
    alert("Agrega productos al carrito");
    return;
  }

  const estabaEditando = editingOrderId !== null;
  let total = totalCarrito();
  let dt = nowDateTime();

  let textoPedido = "";
  carrito.forEach(i=>{
    let emoji=getEmoji(i.nombre);
    textoPedido += `${emoji} ${i.nombre}\n\n`;
  });

  const history = getHistory();
  const pedidoAnterior = estabaEditando ? history.find(p => p.id === editingOrderId) : null;

  const order = {
    id: estabaEditando ? editingOrderId : Date.now(),
    total,
    fechaHora: dt.fecha,
    fechaHoraIso: dt.iso,
    detalles: textoPedido.trim(),
    resumen: `Pedido • $${total}`,
    estado: pedidoAnterior?.estado || "pendiente",
    pagado: pedidoAnterior?.pagado || false,
    items: carrito.map(i => ({...i}))
  };

  saveOrder(order);

  carrito=[];
  seleccionado=null;
  editingOrderId=null;
  render();
  actualizarResumen();

  if(estabaEditando){
    toast("Pedido actualizado en el historial");
  }else{
    toast("Pedido guardado en el historial");
  }
}

function initApp(){
  ensureHistoryFresh();
  render();
  actualizarResumen();
  renderHistory();
}

setInterval(()=>{
  ensureHistoryFresh();
}, 5 * 60 * 1000);

window.addEventListener("storage", (e) => {
  if(e.key === HISTORY_KEY || e.key === HISTORY_RESET_KEY){
    renderHistory();
  }
});

initApp();
</script>
