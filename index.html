<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MENÚ EL MICHI 🐱</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial;
background:#c9daf8;
}

.container{
max-width:500px;
margin:auto;
padding:10px;
}

h1{
text-align:center;
margin:10px;
}

h2{
text-align:center;
margin-top:10px;
}

button{
width:100%;
padding:15px;
margin:5px 0;
font-size:18px;
border:none;
border-radius:10px;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.02);
}

input,select{
width:100%;
padding:12px;
margin:5px 0;
border:none;
border-radius:10px;
font-size:16px;
}

.crepas{background:#ffd966;}
.platanos{background:#ffb347;}
.papas{background:#ff9966;}
.hamb{background:#f6b26b;}
.hot{background:#93c47d;}
.frap{background:#76a5af;}

.enviar{
background:#6fa8dc;
color:white;
}

.eliminar{
background:#e06666;
color:white;
}

.vaciar{
background:#ea9999;
color:white;
}

#carrito{
background:white;
padding:10px;
border-radius:10px;
margin:10px 0;
max-height:250px;
overflow:auto;
min-height:120px;
}

.selected{
background:#b6d7a8 !important;
border:2px solid #6aa84f;
}

.modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
display:none;
overflow:auto;
background:rgba(0,0,0,0.4);
}

.modal-content{
padding:15px;
background:white;
border-radius:20px;
margin:20px;
box-shadow:0 10px 25px rgba(0,0,0,0.25);
}

.modal.crepas .modal-content{background:#fff2cc;}
.modal.platanos .modal-content{background:#ffe599;}
.modal.papas .modal-content{background:#f9cb9c;}
.modal.hamb .modal-content{background:#fce5cd;}
.modal.hot .modal-content{background:#d9ead3;}
.modal.frap .modal-content{background:#d0e0e3;}

.top-bar{
display:flex;
justify-content:space-between;
gap:8px;
}

.top-bar button{
background:#6fa8dc;
color:white;
padding:10px;
border-radius:10px;
}

#titulo{
text-align:center;
margin:10px 0;
font-size:20px;
}

#ops label{
display:block;
padding:10px;
margin:5px 0;
background:#f3f3f3;
border-radius:10px;
}

#estadoUbicacion{
background:white;
padding:10px;
border-radius:10px;
margin:8px 0;
font-size:14px;
}

@media(max-width:400px){

button{
padding:12px;
font-size:15px;
}

}

</style>
</head>

<body>

<div class="container">

<h1>🐱 MENÚ EL MICHI 🐱</h1>

<h2>🚚 Tipo de pedido</h2>

<select id="tipoEntrega">
<option value="Recoger en local">🏪 Recoger en local</option>
<option value="A domicilio">🏠 A domicilio</option>
</select>

<input type="text" id="nombreCliente" placeholder="👤 Nombre del cliente">

<select id="pago">
<option>Efectivo</option>
<option>Transferencia</option>
</select>

<p id="estadoUbicacion">
📍 La ubicación se pedirá automáticamente si eliges envío a domicilio
</p>

<button class="crepas" onclick="crepas()">🥞 Crepas</button>
<button class="platanos" onclick="platanos()">🍌 Plátanos</button>
<button class="papas" onclick="papas()">🍟 Papas, salchipulpos y banderillas</button>
<button class="hamb" onclick="hamb()">🍔 Hamburguesas</button>
<button class="hot" onclick="hot()">🌭 Hot Dogs</button>
<button class="frap" onclick="frap()">🥤 Frappés</button>

<div id="carrito"></div>

<h2 id="total">Total: $0</h2>

<button class="enviar" onclick="enviar()">📲 Enviar pedido</button>
<button class="eliminar" onclick="eliminar()">❌ Eliminar seleccionado</button>
<button class="vaciar" onclick="vaciar()">🗑 Vaciar todo</button>

</div>

<div id="modal" class="modal">

<div class="modal-content">

<div class="top-bar">
<button onclick="back()">⬅</button>
<button onclick="cerrar()">❌</button>
</div>

<h3 id="titulo"></h3>

<div id="ops"></div>

<button onclick="next()">Siguiente ➡️</button>

</div>

</div>

<script>

let carrito=JSON.parse(localStorage.getItem("carrito")) || [];

let seleccionado=null;

let paso=0;
let flujo=[];
let data={};
let maxSel=null;

render();

function setCategoria(cat){

document.getElementById("modal").className="modal "+cat;

document.getElementById("modal").style.display="block";

}

/* EMOJIS */

function getEmoji(nombre){

nombre=nombre.toLowerCase();

if(nombre.includes("hot dog")) return "🌭";

if(
nombre.includes("hamburguesa") ||
nombre.includes("clásica") ||
nombre.includes("hawaiana") ||
nombre.includes("especial")
) return "🍔";

if(nombre.includes("crepa")) return "🥞";

if(nombre.includes("plátanos") || nombre.includes("platano")) return "🍌";

if(
nombre.includes("papas") ||
nombre.includes("salchipulpos") ||
nombre.includes("banderilla")
) return "🍟";

if(nombre.includes("frappé") || nombre.includes("frappe")) return "🥤";

return "🍽️";

}

function abrir(titulo,ops,tipo,max=null){

document.getElementById("titulo").innerText=titulo;

maxSel=max;

let html="";

ops.forEach(o=>{

html+=`
<label>
<input type="${tipo}" name="opcion" value="${o}" onclick="control(this)">
${o}
</label>
`;

});

document.getElementById("ops").innerHTML=html;

}

function cerrar(){

document.getElementById("modal").style.display="none";

}

function back(){

if(paso>0){

paso--;

flujo[paso]();

}

}

function getSel(){

return [...document.querySelectorAll("#ops input:checked")]
.map(i=>i.value);

}

function control(input){

let checks=document.querySelectorAll("#ops input");

if(
input.value==="Ninguna" ||
input.value==="Ninguno" ||
input.value==="Con Todo"
){

if(input.checked){

checks.forEach(c=>{

if(c!==input) c.checked=false;

});

}

}else{

checks.forEach(c=>{

if(
c.value==="Ninguna" ||
c.value==="Ninguno" ||
c.value==="Con Todo"
){
c.checked=false;
}

});

}

if(maxSel && getSel().length>maxSel){
input.checked=false;
}

}

function next(){

let sel=getSel();

if(!sel.length){

alert("Selecciona algo");

return;

}

data[flujo[paso].key]=sel;

paso++;

if(paso<flujo.length){

flujo[paso]();

}else{

cerrar();

flujo.fin();

}

}

function add(txt,precio){

carrito.push({
nombre:txt,
precio
});

localStorage.setItem("carrito",JSON.stringify(carrito));

render();

}

function render(){

let div=document.getElementById("carrito");

div.innerHTML="";

let total=0;

carrito.forEach((i,idx)=>{

let emoji=getEmoji(i.nombre);

div.innerHTML+=`
<p
style="border-bottom:1px solid #ddd;padding:5px;cursor:pointer;"
onclick="seleccionar(${idx})"
class="${seleccionado===idx?'selected':''}"
>
${emoji} ${i.nombre.replace(/\n/g,"<br>")}
</p>
`;

total+=i.precio;

});

document.getElementById("total").innerText="Total: $"+total;

}

function seleccionar(i){

seleccionado=i;

render();

}

function eliminar(){

if(seleccionado!=null){

carrito.splice(seleccionado,1);

localStorage.setItem("carrito",JSON.stringify(carrito));

seleccionado=null;

render();

}

}

function vaciar(){

carrito=[];

localStorage.removeItem("carrito");

render();

}

function totalCarrito(){

return carrito.reduce((acc,item)=>acc+item.precio,0);

}

function obtenerUbicacionActual(){

return new Promise((resolve,reject)=>{

if(!navigator.geolocation){

reject();

return;

}

navigator.geolocation.getCurrentPosition(

(pos)=>{

let lat=pos.coords.latitude;
let lon=pos.coords.longitude;

let link=`https://www.google.com/maps?q=${lat},${lon}`;

resolve({
lat,
lon,
link
});

},

(err)=>{

reject(err);

},

{
enableHighAccuracy:true,
timeout:15000,
maximumAge:0
}

);

});

}

/* CREPAS */

function crepas(){

let precio=40;

add("Crepa personalizada\nPrecio: $40",precio);

}

/* PLATANOS */

function platanos(){

let precio=30;

add("Plátanos preparados\nPrecio: $30",precio);

}

/* PAPAS */

function papas(){

let precio=35;

add("Papas a la francesa\nPrecio: $35",precio);

}

/* HAMBURGUESAS */

function hamb(){

let precio=55;

add("Hamburguesa clásica\nPrecio: $55",precio);

}

/* HOT DOGS */

function hot(){

let precio=20;

add("Hot Dog sencillo\nPrecio: $20",precio);

}

/* FRAPPES */

function frap(){

let precio=30;

add("Frappé\nPrecio: $30",precio);

}

/* ENVIAR */

async function enviar(){

if(carrito.length===0){

alert("Agrega productos al carrito");

return;

}

let nombre=document.getElementById("nombreCliente").value.trim();

let entrega=document.getElementById("tipoEntrega").value;

let pago=document.getElementById("pago").value;

if(nombre===""){

alert("Escribe tu nombre");

return;

}

let total=totalCarrito();

/* MINIMO DOMICILIO */

if(entrega==="A domicilio" && total<100){

alert("🛵 El servicio a domicilio está disponible únicamente en pedidos mayores a $100. Agrega otro producto para continuar.");

return;

}

let txt="🧾 PEDIDO EL MICHI 🐱\n\n";

txt+="👤 Cliente: "+nombre+"\n";

txt+="🚚 Entrega: "+entrega+"\n";

txt+="💳 Pago: "+pago+"\n\n";

carrito.forEach(i=>{

let emoji=getEmoji(i.nombre);

txt+=emoji+" "+i.nombre+"\n\n";

});

/* UBICACION */

if(entrega==="A domicilio"){

try{

document.getElementById("estadoUbicacion").innerText="📍 Obteniendo ubicación...";

let ubicacion=await obtenerUbicacionActual();

txt+="📍 Ubicación:\n";

txt+=ubicacion.link+"\n\n";

document.getElementById("estadoUbicacion").innerText="📍 Ubicación agregada correctamente";

}catch(err){

alert("Necesitamos tu ubicación para realizar el envío a domicilio.");

return;

}

}

txt+="💰 TOTAL: $"+total;

/* LIMPIAR */

carrito=[];

localStorage.removeItem("carrito");

seleccionado=null;

render();

/* WHATSAPP DIRECTO */

let telefono="525532416109";

let mensaje=encodeURIComponent(txt);

let url="whatsapp://send?phone="+telefono+"&text="+mensaje;

window.location.href=url;

/* RESPALDO */

setTimeout(()=>{

window.location.href=
"https://wa.me/"+telefono+"?text="+mensaje;

},1000);

}

</script>

</body>
  </html>
