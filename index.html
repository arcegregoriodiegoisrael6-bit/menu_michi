<style>

@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:'Poppins',sans-serif;
background:
linear-gradient(rgba(0,0,0,0.15),rgba(0,0,0,0.15)),
linear-gradient(135deg,#89f7fe,#66a6ff);
min-height:100vh;
padding:10px;
}

.container{
max-width:550px;
margin:auto;
padding:10px;
animation:fadeIn 0.5s ease;
}

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(15px);
}
to{
opacity:1;
transform:translateY(0);
}
}

h1{
text-align:center;
margin:15px 0;
font-size:38px;
font-weight:700;
color:white;
text-shadow:0 5px 15px rgba(0,0,0,0.3);
}

h2{
text-align:center;
margin-top:12px;
margin-bottom:10px;
color:#333;
font-size:22px;
}

button{
width:100%;
padding:15px;
margin:8px 0;
font-size:18px;
border:none;
border-radius:22px;
font-weight:700;
cursor:pointer;
transition:0.25s;
box-shadow:0 8px 20px rgba(0,0,0,0.15);
position:relative;
overflow:hidden;
}

button:hover{
transform:translateY(-3px) scale(1.01);
}

button:active{
transform:scale(0.98);
}

button::after{
content:'';
position:absolute;
top:0;
left:-100%;
width:100%;
height:100%;
background:rgba(255,255,255,0.2);
transition:0.4s;
}

button:hover::after{
left:100%;
}

input,select{
width:100%;
padding:14px;
margin:6px 0;
border:none;
border-radius:16px;
font-size:16px;
background:rgba(255,255,255,0.9);
backdrop-filter:blur(5px);
outline:none;
box-shadow:0 4px 10px rgba(0,0,0,0.08);
}

.crepas{
background:linear-gradient(135deg,#ffd966,#ffcc33);
color:#333;
}

.platanos{
background:linear-gradient(135deg,#ffb347,#ff9800);
}

.papas{
background:linear-gradient(135deg,#ff9966,#ff7043);
}

.hamb{
background:linear-gradient(135deg,#f6b26b,#e69138);
}

.hot{
background:linear-gradient(135deg,#93c47d,#66bb6a);
}

.frap{
background:linear-gradient(135deg,#76a5af,#4dd0e1);
}

.enviar{
background:linear-gradient(135deg,#00c853,#00e676);
color:white;
}

.eliminar{
background:linear-gradient(135deg,#ff5252,#ff1744);
color:white;
}

.vaciar{
background:linear-gradient(135deg,#ff8a80,#ff5252);
color:white;
}

#carrito{
background:rgba(255,255,255,0.92);
backdrop-filter:blur(10px);
padding:15px;
border-radius:22px;
margin:15px 0;
max-height:300px;
overflow:auto;
min-height:140px;
box-shadow:0 10px 25px rgba(0,0,0,0.15);
}

#carrito::-webkit-scrollbar{
width:6px;
}

#carrito::-webkit-scrollbar-thumb{
background:#999;
border-radius:10px;
}

.selected{
background:#d9ead3 !important;
border:2px solid #4caf50;
transform:scale(1.01);
}

.modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
display:none;
overflow:auto;
background:rgba(0,0,0,0.5);
backdrop-filter:blur(4px);
z-index:999;
animation:fadeModal 0.2s ease;
}

@keyframes fadeModal{
from{
opacity:0;
}
to{
opacity:1;
}
}

.modal-content{
padding:20px;
background:white;
border-radius:28px;
margin:25px auto;
max-width:520px;
box-shadow:0 15px 40px rgba(0,0,0,0.3);
animation:showModal 0.25s ease;
}

@keyframes showModal{
from{
transform:translateY(20px) scale(0.95);
opacity:0;
}
to{
transform:translateY(0) scale(1);
opacity:1;
}
}

.modal.crepas .modal-content{
background:#fff8d6;
}

.modal.platanos .modal-content{
background:#fff0c9;
}

.modal.papas .modal-content{
background:#ffe1d2;
}

.modal.hamb .modal-content{
background:#fff0e0;
}

.modal.hot .modal-content{
background:#e8f5e9;
}

.modal.frap .modal-content{
background:#e1f5fe;
}

.top-bar{
display:flex;
justify-content:space-between;
gap:10px;
}

.top-bar button{
background:linear-gradient(135deg,#42a5f5,#1e88e5);
color:white;
padding:12px;
border-radius:14px;
}

#titulo{
text-align:center;
margin:15px 0;
font-size:24px;
font-weight:700;
color:#333;
}

#ops label{
display:block;
padding:14px;
margin:8px 0;
background:#f5f5f5;
border-radius:16px;
cursor:pointer;
transition:0.2s;
font-weight:500;
box-shadow:0 2px 6px rgba(0,0,0,0.05);
}

#ops label:hover{
background:#ececec;
transform:translateX(3px);
}

#ops input{
margin-right:8px;
transform:scale(1.2);
}

#estadoUbicacion{
background:rgba(255,255,255,0.95);
padding:12px;
border-radius:15px;
margin:10px 0;
font-size:14px;
line-height:1.5;
box-shadow:0 3px 8px rgba(0,0,0,0.08);
}

#total{
font-size:28px;
font-weight:700;
color:#222;
margin:15px 0;
}

.toast{
position:fixed;
bottom:25px;
left:50%;
transform:translateX(-50%);
background:#222;
color:white;
padding:15px 22px;
border-radius:50px;
font-size:15px;
display:none;
z-index:99999;
box-shadow:0 10px 25px rgba(0,0,0,0.3);
animation:toastAnim 0.3s ease;
}

@keyframes toastAnim{
from{
opacity:0;
transform:translateX(-50%) translateY(20px);
}
to{
opacity:1;
transform:translateX(-50%) translateY(0);
}
}

.floating-whatsapp{
position:fixed;
bottom:20px;
right:20px;
width:70px;
height:70px;
background:#25d366;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
font-size:34px;
color:white;
text-decoration:none;
box-shadow:0 10px 25px rgba(0,0,0,0.3);
z-index:999;
transition:0.25s;
}

.floating-whatsapp:hover{
transform:scale(1.08);
}

@media(max-width:400px){

button{
padding:13px;
font-size:15px;
}

h1{
font-size:30px;
}

#titulo{
font-size:20px;
}

}

</style>

<!--
AGREGA ESTO JUSTO ANTES DE </body>
NO BORRA NADA DE TU SCRIPT ORIGINAL
-->

<div class="toast" id="toast"></div>

<a class="floating-whatsapp" href="#">
💬
</a>

<script>

/* TOAST BONITO */

function toast(msg){

let t=document.getElementById("toast");

t.innerText=msg;

t.style.display="block";

setTimeout(()=>{
t.style.display="none";
},2500);

}

/* SONIDO */

function sonidoAgregar(){

let audio=new Audio("https://cdn.pixabay.com/download/audio/2022/03/15/audio_115b9b2f39.mp3");

audio.volume=0.25;

audio.play();

}

/* MEJORAR ALERTAS */

const oldAlert=window.alert;

window.alert=function(msg){

toast(msg);

}

/* EFECTO AL AGREGAR */

const oldAdd=add;

add=function(txt,precio){

oldAdd(txt,precio);

sonidoAgregar();

}

/* UBICACIÓN MÁS FUERTE */

async function obtenerUbicacionActual(){

if(!navigator.geolocation){

throw "Ubicación no soportada";

}

return new Promise((resolve,reject)=>{

navigator.geolocation.getCurrentPosition(

(pos)=>{

let lat=pos.coords.latitude;

let lon=pos.coords.longitude;

let link=`https://www.google.com/maps?q=${lat},${lon}`;

resolve({
lat,
lon,
link
});

},

(err)=>{

if(err.code===1){

toast("⚠️ Debes permitir la ubicación");

}else{

toast("⚠️ No pudimos obtener tu ubicación");

}

reject(err);

},

{
enableHighAccuracy:true,
timeout:20000,
maximumAge:0
}

);

});

}

</script>
