<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MENÚ EL MICHI 🐱</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Arial;background:#c9daf8;}

.container{max-width:500px;margin:auto;padding:10px;}

h1{text-align:center;margin:10px;}
h2{text-align:center;}

button{
width:100%;
padding:15px;
margin:5px 0;
font-size:18px;
border:none;
border-radius:10px;
font-weight:bold;
cursor:pointer;
}

.crepas{background:#ffd966;}
.platanos{background:#ffb347;}
.papas{background:#ff9966;}
.hamb{background:#f6b26b;}
.hot{background:#93c47d;}
.frap{background:#76a5af;}

.enviar{background:#6fa8dc;color:white;}
.eliminar{background:#e06666;color:white;}
.vaciar{background:#ea9999;color:white;}

#carrito{
background:white;
padding:10px;
border-radius:10px;
margin:10px 0;
max-height:200px;
overflow:auto;
}

.selected{background:#d9ead3;}

.modal{
position:fixed;
top:0;left:0;
width:100%;height:100%;
display:none;
overflow:auto;
}

.modal-content{
padding:15px;
background:white;
border-radius:20px;
margin:20px;
box-shadow:0 10px 25px rgba(0,0,0,0.25);
}

.top-bar{display:flex;justify-content:space-between;}

.top-bar button{
background:#6fa8dc;
color:white;
padding:10px;
border-radius:10px;
}

#titulo{text-align:center;margin:10px 0;font-size:20px;}

#ops label{
display:block;
padding:10px;
margin:5px 0;
background:#f3f3f3;
border-radius:10px;
}
</style>
</head>

<body>

<div class="container">
<h1>🐱 MENÚ EL MICHI 🐱</h1>

<button class="crepas" onclick="crepas()">🥞 Crepas</button>
<button class="platanos" onclick="platanos()">🍌 Plátanos</button>
<button class="papas" onclick="papas()">🍟 Papas</button>
<button class="hamb" onclick="hamb()">🍔 Hamburguesas</button>
<button class="hot" onclick="hot()">🌭 Hot Dogs</button>
<button class="frap" onclick="frap()">🥤 Frappés</button>

<div id="carrito"></div>
<h2 id="total">Total: $0</h2>

<button class="enviar" onclick="enviar()">📲 Enviar pedido</button>
<button class="eliminar" onclick="eliminar()">❌ Eliminar</button>
<button class="vaciar" onclick="vaciar()">🗑 Vaciar</button>
</div>

<div id="modal" class="modal">
<div class="modal-content">
<div class="top-bar">
<button onclick="back()">⬅</button>
<button onclick="cerrar()">❌</button>
</div>
<h3 id="titulo"></h3>
<div id="ops"></div>
<button onclick="next()">Siguiente ➡️</button>
</div>
</div>

<script>
let carrito=[], seleccionado=null;
let paso=0, flujo=[], data={}, maxSel=null;

function setCategoria(cat){
document.getElementById("modal").className="modal "+cat;
document.getElementById("modal").style.display="block";
}

function abrir(titulo,ops,tipo,max=null){
document.getElementById("titulo").innerText=titulo;
maxSel=max;

let html="";
ops.forEach(o=>{
let label = typeof o === "object" ? o.label : o;
let value = typeof o === "object" ? o.value : o;

html+=`<label><input type="${tipo}" name="opcion" value="${value}" onclick="control(this)"> ${label}</label>`;
});

document.getElementById("ops").innerHTML=html;
}

function cerrar(){document.getElementById("modal").style.display="none";}
function back(){if(paso>0){paso--;flujo[paso]();}}

function getSel(){
return [...document.querySelectorAll("#ops input:checked")].map(i=>i.value);
}

function control(input){
let checks=document.querySelectorAll("#ops input");

if(input.value==="Ninguna"||input.value==="Ninguno"){
if(input.checked) checks.forEach(c=>{if(c!==input)c.checked=false;});
}else{
checks.forEach(c=>{
if(c.value==="Ninguna"||c.value==="Ninguno") c.checked=false;
});
}

if(maxSel && getSel().length>maxSel) input.checked=false;
}

function next(){
let sel=getSel();
if(!sel.length){alert("Selecciona algo");return;}

data[flujo[paso].key]=sel;
paso++;

if(paso<flujo.length) flujo[paso]();
else{cerrar();flujo.fin();}
}

function add(txt,precio){
carrito.push({nombre:txt,precio});
render();
}

function render(){
let div=document.getElementById("carrito");
div.innerHTML="";
let total=0;

carrito.forEach((i,idx)=>{
div.innerHTML+=`<p onclick="seleccionar(${idx})" class="${seleccionado===idx?'selected':''}">
$${i.precio} - ${i.nombre.replace(/\n/g,"<br>")}
</p>`;
total+=i.precio;
});

document.getElementById("total").innerText="Total: $"+total;
}

function seleccionar(i){seleccionado=i;render();}
function eliminar(){if(seleccionado!=null){carrito.splice(seleccionado,1);seleccionado=null;render();}}
function vaciar(){carrito=[];render();}

/* ================= PLATANOS ================= */
function platanos(){
setCategoria("platanos");
paso=0;data={};

flujo=[
()=>abrir("Tipo",[
{label:"Fritos - $30",value:"Fritos"},
{label:"Árabes - $40",value:"Árabes"}
],"radio"),
()=>abrir("Complementos",["Crema","Lechera","Mermelada","Ninguna"],"checkbox"),
()=>abrir("Toppings",["Chocolate","Nuez","Lunetitas","Ninguno"],"radio")
];

flujo[0].key="tipo";
flujo[1].key="comp";
flujo[2].key="top";

flujo.fin=function(){
let tipo=data.tipo[0];
let precio=tipo==="Fritos"?30:40;
add("Plátanos "+tipo,precio);
};

flujo[0]();
}

/* ================= PAPAS ================= */
function papas(){
setCategoria("papas");
paso=0;data={};

flujo=[
()=>abrir("Tipo",[
{label:"Papas a la francesa - $35",value:"Papas"},
{label:"Salchipulpos - $45",value:"Salchi"},
{label:"Banderilla con papas - $35",value:"BandiPapas"},
{label:"Banderilla sola - $25",value:"Bandi"}
],"radio"),

()=>abrir("Aderezos",["Catsup","Queso","Salsa","Ninguno"],"checkbox")
];

flujo[0].key="tipo";
flujo[1].key="ad";

flujo.fin=function(){
let precios={"Papas":35,"Salchi":45,"BandiPapas":35,"Bandi":25};
let t=data.tipo[0];
add(t,precios[t]);
};

flujo[0]();
}

/* ================= HAMBURGUESAS (CON OMITIR INGREDIENTES RESTAURADO) ================= */
function hamb(){
setCategoria("hamb");
paso=0;data={};

flujo=[
()=>abrir("Tipo",[
{label:"Clásica - $55",value:"Clásica"},
{label:"Hawaiana - $60",value:"Hawaiana"},
{label:"Especial - $65",value:"Especial"}
],"radio"),

/* ✔ VENTANA RESTAURADA */
()=>abrir("Omitir ingredientes",[
{label:"Jamón",value:"Jamón"},
{label:"Queso",value:"Queso"},
{label:"Jitomate",value:"Jitomate"},
{label:"Cebolla",value:"Cebolla"},
{label:"Lechuga",value:"Lechuga"},
{label:"Mayonesa",value:"Mayonesa"},
{label:"Mostaza",value:"Mostaza"},
{label:"Catsup",value:"Catsup"},
{label:"Ninguna",value:"Ninguna"}
],"checkbox"),

()=>abrir("Extras",["Piña $8","Tocino $8","Carne $10","Ninguno"],"checkbox"),

()=>abrir("Con papas +$10",["Con papas","Sin papas"],"radio")
];

flujo[0].key="tipo";
flujo[1].key="sin";
flujo[2].key="extra";
flujo[3].key="papas";

flujo.fin=function(){

let precios={"Clásica":55,"Hawaiana":60,"Especial":65};
let tipo=data.tipo[0];
let precio=precios[tipo];

if(data.papas[0]==="Con papas") precio+=10;

(data.extra||[]).forEach(e=>{
if(e.includes("8")) precio+=8;
if(e.includes("10")) precio+=10;
});

add("Hamburguesa "+tipo,precio);
};

flujo[0]();
}

/* ================= HOT DOGS (NUEVA VENTANA CORRECTA) ================= */
function hot(){
setCategoria("hot");
paso=0;data={};

flujo=[
()=>abrir("Tipo",[
{label:"Sencillo",value:"Sencillo"},
{label:"Especial",value:"Especial"}
],"radio"),

()=>abrir("¿Qué cantidad?",[
{label:"1 - $25",value:"1"},
{label:"2 - $50",value:"2"},
{label:"3 - $70",value:"3"}
],"radio")
];

flujo[0].key="tipo";
flujo[1].key="cant";

flujo.fin=function(){

let precios={
Sencillo:{1:20,2:40,3:55},
Especial:{1:25,2:50,3:70}
};

let tipo=data.tipo[0];
let cant=parseInt(data.cant[0]);

add(`Hot Dog ${tipo} x${cant}`,precios[tipo][cant]);
};

flujo[0]();
}

/* ================= FRAPPÉS ================= */
function frap(){
setCategoria("frap");
paso=0;data={};

flujo=[
()=>abrir("Tipo",[
{label:"Oreo - $30",value:"Oreo"},
{label:"Mazapán - $30",value:"Mazapán"},
{label:"Frappuccino - $30",value:"Frappuccino"},
{label:"Fresa",value:"Fresa"}
],"radio"),

()=>abrir("Tamaño",[
{label:"Chico - $35",value:"Chico"},
{label:"Grande - $60",value:"Grande"}
],"radio")
];

flujo[0].key="tipo";
flujo[1].key="tam";

flujo.fin=function(){

let precios={
Oreo:{Chico:30,Grande:50},
Mazapán:{Chico:30,Grande:50},
Frappuccino:{Chico:30,Grande:50},
Fresa:{Chico:35,Grande:60}
};

let tipo=data.tipo[0];
let tam=data.tam[0];

add(`Frappé ${tipo} ${tam}`,precios[tipo][tam]);
};

flujo[0]();
}

/* ================= ENVIAR ================= */
function enviar(){
let txt="🧾 Pedido El Michi%0A%0A";
let total=0;

carrito.forEach(i=>{
txt+=i.nombre+"%0A%0A";
total+=i.precio;
});

txt+="💰 Total: $"+total;

window.open("https://wa.me/525532416109?text="+encodeURIComponent(txt));
}
</script>

</body>
</html>
