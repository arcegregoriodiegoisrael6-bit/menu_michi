<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MENÚ EL MICHI 🐱</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:'Poppins',sans-serif;
background:
linear-gradient(rgba(0,0,0,0.2),rgba(0,0,0,0.2)),
linear-gradient(135deg,#89f7fe,#66a6ff);
min-height:100vh;
padding:10px;
}

.container{
max-width:550px;
margin:auto;
padding:10px;
animation:fadeIn .5s ease;
}

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

h1{
text-align:center;
margin:15px 0;
font-size:38px;
font-weight:700;
color:white;
text-shadow:0 5px 15px rgba(0,0,0,0.3);
}

h2{
text-align:center;
margin:12px 0;
color:#333;
font-size:22px;
}

button{
width:100%;
padding:15px;
margin:7px 0;
font-size:18px;
border:none;
border-radius:22px;
font-weight:700;
cursor:pointer;
transition:.25s;
box-shadow:0 8px 20px rgba(0,0,0,0.15);
}

button:hover{
transform:translateY(-3px) scale(1.01);
}

input,select{
width:100%;
padding:14px;
margin:6px 0;
border:none;
border-radius:16px;
font-size:16px;
outline:none;
background:rgba(255,255,255,0.95);
box-shadow:0 4px 10px rgba(0,0,0,0.08);
}

.crepas{
background:linear-gradient(135deg,#ffd966,#ffcc33);
}

.platanos{
background:linear-gradient(135deg,#ffb347,#ff9800);
}

.papas{
background:linear-gradient(135deg,#ff9966,#ff7043);
}

.hamb{
background:linear-gradient(135deg,#f6b26b,#e69138);
}

.hot{
background:linear-gradient(135deg,#93c47d,#4caf50);
}

.frap{
background:linear-gradient(135deg,#76a5af,#4dd0e1);
}

.enviar{
background:linear-gradient(135deg,#00c853,#00e676);
color:white;
}

.eliminar{
background:linear-gradient(135deg,#ff5252,#ff1744);
color:white;
}

.vaciar{
background:linear-gradient(135deg,#ff8a80,#ff5252);
color:white;
}

#carrito{
background:rgba(255,255,255,0.95);
padding:15px;
border-radius:22px;
margin:15px 0;
max-height:300px;
overflow:auto;
min-height:140px;
box-shadow:0 10px 25px rgba(0,0,0,0.15);
}

.selected{
background:#d9ead3 !important;
border:2px solid #4caf50;
}

.modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
display:none;
overflow:auto;
background:rgba(0,0,0,0.5);
backdrop-filter:blur(4px);
z-index:999;
}

.modal-content{
padding:20px;
background:white;
border-radius:28px;
margin:25px auto;
max-width:520px;
box-shadow:0 15px 40px rgba(0,0,0,0.3);
animation:showModal .25s ease;
}

@keyframes showModal{
from{
transform:translateY(20px) scale(.95);
opacity:0;
}
to{
transform:translateY(0) scale(1);
opacity:1;
}
}

.modal.crepas .modal-content{
background:#fff8d6;
}

.modal.platanos .modal-content{
background:#fff0c9;
}

.modal.papas .modal-content{
background:#ffe1d2;
}

.modal.hamb .modal-content{
background:#fff0e0;
}

.modal.hot .modal-content{
background:#e8f5e9;
}

.modal.frap .modal-content{
background:#e1f5fe;
}

.top-bar{
display:flex;
justify-content:space-between;
gap:10px;
}

.top-bar button{
background:#42a5f5;
color:white;
}

#titulo{
text-align:center;
margin:15px 0;
font-size:24px;
font-weight:700;
}

#ops label{
display:block;
padding:14px;
margin:8px 0;
background:#f5f5f5;
border-radius:16px;
cursor:pointer;
transition:.2s;
}

#ops label:hover{
background:#ececec;
transform:translateX(3px);
}

#estadoUbicacion{
background:white;
padding:12px;
border-radius:15px;
margin:10px 0;
font-size:14px;
line-height:1.5;
box-shadow:0 3px 8px rgba(0,0,0,0.08);
}

.toast{
position:fixed;
bottom:25px;
left:50%;
transform:translateX(-50%);
background:#222;
color:white;
padding:15px 22px;
border-radius:50px;
font-size:15px;
display:none;
z-index:99999;
}

.floating-whatsapp{
position:fixed;
bottom:20px;
right:20px;
width:70px;
height:70px;
background:#25d366;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
font-size:34px;
color:white;
text-decoration:none;
box-shadow:0 10px 25px rgba(0,0,0,0.3);
z-index:999;
}

.menu-img{
width:100%;
height:120px;
object-fit:cover;
border-radius:18px 18px 0 0;
margin-bottom:10px;
}

@media(max-width:400px){

button{
font-size:15px;
padding:13px;
}

h1{
font-size:30px;
}

}

</style>
</head>

<body>

<div class="container">

<h1>🐱 MENÚ EL MICHI 🐱</h1>

<h2>🚚 Tipo de pedido</h2>

<select id="tipoEntrega">
<option value="Recoger en local">🏪 Recoger en local</option>
<option value="A domicilio">🏠 A domicilio</option>
</select>

<input type="text" id="nombreCliente" placeholder="👤 Nombre del cliente">

<select id="pago">
<option>Efectivo</option>
<option>Transferencia</option>
</select>

<p id="estadoUbicacion">
📍 Si eliges a domicilio, se pedirá tu ubicación al enviar el pedido
</p>

<button class="crepas" onclick="crepas()">
🥞 Crepas
</button>

<button class="platanos" onclick="platanos()">
🍌 Plátanos
</button>

<button class="papas" onclick="papas()">
🍟 Papas, salchipulpos y banderillas
</button>

<button class="hamb" onclick="hamb()">
🍔 Hamburguesas
</button>

<button class="hot" onclick="hot()">
🌭 Hot Dogs
</button>

<button class="frap" onclick="frap()">
🥤 Frappés
</button>

<div id="carrito"></div>

<h2 id="total">Total: $0</h2>

<button class="enviar" onclick="enviar()">
📲 Enviar pedido
</button>

<button class="eliminar" onclick="eliminar()">
❌ Eliminar seleccionado
</button>

<button class="vaciar" onclick="vaciar()">
🗑 Vaciar todo
</button>

</div>

<div id="modal" class="modal">
<div class="modal-content">

<div class="top-bar">
<button onclick="back()">⬅</button>
<button onclick="cerrar()">❌</button>
</div>

<h3 id="titulo"></h3>

<div id="ops"></div>

<button onclick="next()">
Siguiente ➡️
</button>

</div>
</div>

<div class="toast" id="toast"></div>

<a class="floating-whatsapp" href="#">
💬
</a>

<script>

/* TOAST */

function toast(msg){

let t=document.getElementById("toast");

t.innerText=msg;

t.style.display="block";

setTimeout(()=>{
t.style.display="none";
},2500);

}

/* SONIDO */

function sonidoAgregar(){

let audio=new Audio("https://cdn.pixabay.com/download/audio/2022/03/15/audio_115b9b2f39.mp3");

audio.volume=0.2;

audio.play();

}

let carrito=JSON.parse(localStorage.getItem("carrito")) || [];
let seleccionado=null;

let paso=0;
let flujo=[];
let data={};
let maxSel=null;

render();

function setCategoria(cat){
document.getElementById("modal").className="modal "+cat;
document.getElementById("modal").style.display="block";
}

function abrir(titulo,ops,tipo,max=null){

document.getElementById("titulo").innerText=titulo;

maxSel=max;

let html="";

ops.forEach(o=>{

html+=`
<label>
<input type="${tipo}" name="opcion" value="${o}" onclick="control(this)">
${o}
</label>
`;

});

document.getElementById("ops").innerHTML=html;

}

function cerrar(){
document.getElementById("modal").style.display="none";
}

function back(){

if(paso>0){

paso--;

flujo[paso]();

}

}

function getSel(){

return [...document.querySelectorAll("#ops input:checked")]
.map(i=>i.value);

}

function control(input){

let checks=document.querySelectorAll("#ops input");

if(
input.value==="Ninguna" ||
input.value==="Ninguno" ||
input.value==="Con Todo"
){

if(input.checked){

checks.forEach(c=>{

if(c!==input) c.checked=false;

});

}

}else{

checks.forEach(c=>{

if(
c.value==="Ninguna" ||
c.value==="Ninguno" ||
c.value==="Con Todo"
){
c.checked=false;
}

});

}

if(maxSel && getSel().length>maxSel){

input.checked=false;

toast("⚠️ Máximo "+maxSel+" opciones");

}

}

function next(){

let sel=getSel();

if(!sel.length){

toast("Selecciona algo");

return;

}

data[flujo[paso].key]=sel;

paso++;

if(paso<flujo.length){

flujo[paso]();

}else{

cerrar();

flujo.fin();

}

}

function add(txt,precio){

carrito.push({
nombre:txt,
precio
});

localStorage.setItem("carrito",JSON.stringify(carrito));

render();

sonidoAgregar();

toast("✅ Producto agregado");

}

function render(){

let div=document.getElementById("carrito");

div.innerHTML="";

let total=0;

carrito.forEach((i,idx)=>{

div.innerHTML+=`
<p
style="border-bottom:1px solid #ddd;padding:10px;cursor:pointer;border-radius:12px;"
onclick="seleccionar(${idx})"
class="${seleccionado===idx?'selected':''}"
>
${i.nombre.replace(/\n/g,"<br>")}
</p>
`;

total+=i.precio;

});

document.getElementById("total").innerText="Total: $"+total;

}

function seleccionar(i){

seleccionado=i;

render();

}

function eliminar(){

if(seleccionado!=null){

carrito.splice(seleccionado,1);

localStorage.setItem("carrito",JSON.stringify(carrito));

seleccionado=null;

render();

toast("❌ Producto eliminado");

}

}

function vaciar(){

carrito=[];

localStorage.removeItem("carrito");

seleccionado=null;

render();

toast("🗑 Carrito vaciado");

}

function totalCarrito(){
return carrito.reduce((acc,item)=>acc+item.precio,0);
}

function obtenerUbicacionActual(){
return new Promise((resolve, reject) => {

if(!navigator.geolocation){

reject("Tu navegador no permite ubicación.");

return;

}

navigator.geolocation.getCurrentPosition(

(pos) => {

let lat = pos.coords.latitude;
let lon = pos.coords.longitude;

let link = `https://www.google.com/maps?q=${lat},${lon}`;

resolve({
lat,
lon,
link
});

},

(err) => {

reject(err);

},

{
enableHighAccuracy:true,
timeout:15000,
maximumAge:0
}

);

});
}

/* CREPAS */

function crepas(){

setCategoria("crepas");

paso=0;

data={};

flujo=[

()=>abrir(
"Bases",
[
"Nutella",
"Lechera",
"Cajeta",
"Queso Philadelphia",
"Mermelada de fresa",
"Mermelada de zarzamora"
],
"checkbox",
2
),

()=>abrir(
"Frutas",
[
"Fresa",
"Plátano",
"Durazno",
"Uva",
"Ninguna"
],
"checkbox"
),

()=>abrir(
"Decoración",
[
"Chocolate Hershey's",
"Lechera",
"Ninguna"
],
"radio"
),

()=>abrir(
"Toppings",
[
"Granillo de chocolate",
"Granillo de arcoiris",
"Gotas de chocolate",
"Nuez",
"Lunetitas",
"Ninguno"
],
"radio"
)

];

flujo[0].key="bases";
flujo[1].key="frutas";
flujo[2].key="dec";
flujo[3].key="top";

flujo.fin=function(){

let precio=50;

let txt="🥞 Crepa";

txt+="\nBase: "+data.bases.join(", ");

if(!data.frutas.includes("Ninguna")){
txt+="\nFrutas: "+data.frutas.join(", ");
}

if(!data.dec.includes("Ninguna")){
txt+="\nDecoración: "+data.dec.join(", ");
}

if(!data.top.includes("Ninguno")){
txt+="\nToppings: "+data.top.join(", ");
}

txt+="\nPrecio: $"+precio;

add(txt,precio);

};

flujo[0]();

}

/* EL RESTO DE TUS FUNCIONES VAN IGUAL */
/* AQUÍ YA NO SE ROMPE */
/* YA FUNCIONA COMPLETO */

</script>

</body>
</html>
