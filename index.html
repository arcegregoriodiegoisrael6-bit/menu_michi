<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MENÚ EL MICHI 🐱</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;}

body{font-family:Arial;background:#c9daf8;}

.container{max-width:500px;margin:auto;padding:10px;}

h1{text-align:center;margin:10px;}

.client-box{
background:white;
padding:10px;
border-radius:10px;
margin:10px 0;
}

input{
width:100%;
padding:10px;
margin-top:5px;
border-radius:8px;
border:1px solid #ccc;
}

button{
width:100%;
padding:15px;
margin:5px 0;
font-size:18px;
border:none;
border-radius:10px;
font-weight:bold;
}

.crepas{background:#ffd966;}
.platanos{background:#ffb347;}
.papas{background:#ff9966;}
.hamb{background:#f6b26b;}
.hot{background:#93c47d;}
.frap{background:#76a5af;}

.enviar{background:#6fa8dc;color:white;}
.eliminar{background:#e06666;color:white;}
.vaciar{background:#ea9999;color:white;}

#carrito{
background:white;
padding:10px;
border-radius:10px;
margin:10px 0;
max-height:200px;
overflow:auto;
}

.selected{background:#d9ead3;}

.modal{
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:white;
display:none;
z-index:10;
overflow:auto;
}

.modal-content{padding:15px;}

label.option{
display:block;
padding:10px;
border-bottom:1px solid #ddd;
}
</style>
</head>

<body>

<div class="container">

<h1>MENÚ EL MICHI 🐱</h1>

<div class="client-box">
<label>👤 Cliente</label>
<input type="text" id="cliente" placeholder="Nombre del cliente">
</div>

<button class="crepas" onclick="crepas()">Crepas</button>
<button class="platanos" onclick="platanos()">Plátanos</button>
<button class="papas" onclick="papas()">Papas</button>
<button class="hamb" onclick="hamb()">Hamburguesas</button>
<button class="hot" onclick="hot()">Hot Dogs</button>
<button class="frap" onclick="frap()">Frappés</button>

<div id="carrito"></div>
<h2 id="total">Total: $0</h2>

<button class="enviar" onclick="enviar()">Enviar pedido</button>
<button class="eliminar" onclick="eliminar()">Eliminar seleccionado</button>
<button class="vaciar" onclick="vaciar()">Vaciar todo</button>

</div>

<!-- MODAL FIJO -->
<div id="modal" class="modal">
<div class="modal-content">
<h3 id="titulo"></h3>
<div id="ops"></div>
<button onclick="next()">Siguiente</button>
<button onclick="cerrar()">Cerrar</button>
</div>
</div>

<script>

let carrito=[], seleccionado=null;
let paso=0, flujo=[], data={}, maxSel=null;

// ===== MODAL =====
function abrir(titulo,ops,tipo,max=null){
document.getElementById("modal").style.display="block";
document.getElementById("titulo").innerText=titulo;
maxSel=max;

let html="";
ops.forEach(o=>{
html+=`
<label class="option">
<input type="${tipo}" value="${o}"> ${o}
</label>`;
});

document.getElementById("ops").innerHTML=html;
}

function cerrar(){
document.getElementById("modal").style.display="none";
paso=0;
data={};
}

// ===== SELECCIÓN =====
function getSel(){
return [...document.querySelectorAll("#ops input:checked")].map(i=>i.value);
}

function next(){
let sel=getSel();
if(!sel.length){
alert("Selecciona algo");
return;
}

data[flujo[paso].key]=sel;
paso++;

if(paso<flujo.length){
flujo[paso]();
}else{
cerrar();
flujo.fin();
}
}

// ===== CARRITO =====
function add(txt,precio){
carrito.push({nombre:txt,precio});
render();
}

function render(){
let div=document.getElementById("carrito");
div.innerHTML="";
let total=0;

carrito.forEach((i,idx)=>{
div.innerHTML+=`
<p onclick="seleccionar(${idx})"
class="${seleccionado===idx?'selected':''}">
$${i.precio} - ${i.nombre}</p>`;
total+=i.precio;
});

document.getElementById("total").innerText="Total: $"+total;
}

function seleccionar(i){seleccionado=i;render();}
function eliminar(){if(seleccionado!=null){carrito.splice(seleccionado,1);seleccionado=null;render();}}
function vaciar(){carrito=[];render();}

// ===== MENÚS =====
function crepas(){
paso=0;data={};

flujo=[
()=>abrir("Bases",["Nutella","Lechera","Cajeta"],"checkbox"),
()=>abrir("Frutas",["Fresa","Plátano","Ninguna"],"checkbox")
];

flujo[0].key="bases";
flujo[1].key="frutas";

flujo.fin=function(){
let precio=40;
let txt="Crepa "+(data.bases||[]).join(", ");
add(txt,precio);
};

flujo[0]();
}

function platanos(){
paso=0;data={};

flujo=[
()=>abrir("Tipo",["Fritos","Árabes"],"radio")
];

flujo[0].key="tipo";

flujo.fin=function(){
let precio=30;
add("Plátanos "+data.tipo,precio);
};

flujo[0]();
}

function papas(){
paso=0;data={};

flujo=[
()=>abrir("Tipo",["Papas","Banderillas"],"radio")
];

flujo[0].key="tipo";

flujo.fin=function(){
add("Papas "+data.tipo,35);
};

flujo[0]();
}

function hamb(){
paso=0;data={};

flujo=[
()=>abrir("Tipo",["Clásica","Hawaiana"],"radio")
];

flujo[0].key="tipo";

flujo.fin=function(){
add("Hamburguesa "+data.tipo,60);
};

flujo[0]();
}

function hot(){
paso=0;data={};

flujo=[
()=>abrir("Tipo",["Sencillo","Especial"],"radio")
];

flujo[0].key="tipo";

flujo.fin=function(){
add("Hot Dog "+data.tipo,25);
};

flujo[0]();
}

function frap(){
paso=0;data={};

flujo=[
()=>abrir("Tipo",["Oreo","Fresa"],"radio")
];

flujo[0].key="tipo";

flujo.fin=function(){
add("Frappé "+data.tipo,35);
};

flujo[0]();
}

// ===== ENVIAR =====
function enviar(){

let nombre=document.getElementById("cliente").value.trim();

if(!nombre){
alert("Escribe el nombre del cliente");
return;
}

let mensaje=`🐱 MENÚ EL MICHI\nCliente: ${nombre}\n\n`;
let total=0;

carrito.forEach(i=>{
mensaje+=i.nombre+"\n\n";
total+=i.precio;
});

mensaje+=`💰 Total: $${total}`;

window.open("https://wa.me/525532416109?text="+encodeURIComponent(mensaje));

}

</script>

</body>
</html>
