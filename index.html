<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel de Pedidos</title>
  <style>
    :root{
      --bg:#0f172a;
      --card:#111827;
      --card2:#1f2937;
      --text:#e5e7eb;
      --muted:#9ca3af;
      --line:#334155;
      --prep:#f59e0b;
      --delivered:#22c55e;
      --cancelled:#ef4444;
      --paid:#60a5fa;
      --btn:#2563eb;
      --btn2:#374151;
      --shadow:0 10px 30px rgba(0,0,0,.25);
      --radius:18px;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Arial, Helvetica, sans-serif;
      background:linear-gradient(180deg, #0b1220, var(--bg));
      color:var(--text);
      padding:20px;
    }

    .app{
      max-width:1200px;
      margin:0 auto;
    }

    .header{
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:flex-end;
      margin-bottom:18px;
      flex-wrap:wrap;
    }

    .header h1{
      margin:0;
      font-size:clamp(24px, 4vw, 36px);
    }

    .header p{
      margin:6px 0 0;
      color:var(--muted);
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(280px, 1fr));
      gap:16px;
    }

    .ticket{
      background:var(--card);
      border:1px solid rgba(255,255,255,.06);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      overflow:hidden;
      transition:transform .2s ease, background .2s ease, border-color .2s ease;
    }

    .ticket:hover{transform:translateY(-2px)}

    .ticket-top{
      padding:16px;
      border-bottom:1px solid rgba(255,255,255,.06);
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:flex-start;
    }

    .ticket-info h2{
      margin:0 0 6px;
      font-size:20px;
    }

    .ticket-info .meta{
      color:var(--muted);
      font-size:14px;
      line-height:1.4;
    }

    .badges{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      justify-content:flex-end;
      align-items:center;
    }

    .badge{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:7px 11px;
      border-radius:999px;
      font-size:12px;
      font-weight:700;
      letter-spacing:.3px;
      text-transform:uppercase;
      white-space:nowrap;
    }

    .badge.paid{background:rgba(96,165,250,.16); color:#bfdbfe; border:1px solid rgba(96,165,250,.35)}
    .badge.preparing{background:rgba(245,158,11,.16); color:#fde68a; border:1px solid rgba(245,158,11,.35)}
    .badge.delivered{background:rgba(34,197,94,.16); color:#bbf7d0; border:1px solid rgba(34,197,94,.35)}
    .badge.cancelled{background:rgba(239,68,68,.16); color:#fecaca; border:1px solid rgba(239,68,68,.35)}
    .badge.none{background:rgba(148,163,184,.14); color:#d1d5db; border:1px solid rgba(148,163,184,.25)}

    .ticket-body{
      padding:16px;
    }

    .items{
      margin:0;
      padding-left:18px;
      color:#e5e7eb;
      line-height:1.55;
    }

    .total{
      margin-top:14px;
      font-size:18px;
      font-weight:800;
    }

    .controls{
      padding:16px;
      border-top:1px solid rgba(255,255,255,.06);
      display:grid;
      gap:10px;
    }

    .status-row{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
    }

    button{
      border:0;
      cursor:pointer;
      border-radius:12px;
      padding:10px 14px;
      font-weight:700;
      transition:transform .15s ease, opacity .15s ease, background .15s ease;
      color:white;
    }

    button:hover{transform:translateY(-1px); opacity:.95}
    button:active{transform:translateY(0)}

    .btn-prep{background:var(--prep); color:#111827}
    .btn-del{background:var(--delivered); color:#052e16}
    .btn-can{background:var(--cancelled)}
    .btn-paid{background:var(--paid); color:#0f172a}
    .btn-clear{background:var(--btn2)}

    .legend{
      margin:0 0 16px;
      color:var(--muted);
      font-size:14px;
    }

    .ticket.preparing{border-color:rgba(245,158,11,.55); background:linear-gradient(180deg, rgba(245,158,11,.08), rgba(17,24,39,1) 35%)}
    .ticket.delivered{border-color:rgba(34,197,94,.55); background:linear-gradient(180deg, rgba(34,197,94,.08), rgba(17,24,39,1) 35%)}
    .ticket.cancelled{border-color:rgba(239,68,68,.55); background:linear-gradient(180deg, rgba(239,68,68,.08), rgba(17,24,39,1) 35%)}
    .ticket.paid{
      border-color:rgba(96,165,250,.45);
      background:linear-gradient(180deg, rgba(96,165,250,.06), rgba(17,24,39,1) 35%);
    }

    @media (max-width: 640px){
      body{padding:14px}
      .ticket-top{flex-direction:column}
      .badges{justify-content:flex-start}
      button{width:100%}
      .status-row{display:grid; grid-template-columns:1fr 1fr}
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div>
        <h1>Panel de Pedidos</h1>
        <p>Selecciona el estado de cada ticket. “Pagado” se queda fijo y los demás estados aparecen a un lado.</p>
      </div>
    </div>

    <p class="legend">Colores del ticket: preparando = naranja, entregado = verde, cancelado = rojo.</p>

    <div class="grid" id="orders"></div>
  </div>

  <script>
    const orders = [
      {
        id: 1,
        cliente: 'Cliente 1',
        hora: '12:40 PM',
        items: ['2 crepas de Nutella', '1 refresco'],
        total: '$120.00',
        paid: false,
        status: ''
      },
      {
        id: 2,
        cliente: 'Cliente 2',
        hora: '12:52 PM',
        items: ['1 hot cake', '1 café'],
        total: '$95.00',
        paid: true,
        status: 'preparing'
      },
      {
        id: 3,
        cliente: 'Cliente 3',
        hora: '1:05 PM',
        items: ['1 waffle especial'],
        total: '$80.00',
        paid: false,
        status: 'delivered'
      }
    ];

    const container = document.getElementById('orders');

    function statusLabel(status){
      if(status === 'preparing') return 'Preparando';
      if(status === 'delivered') return 'Entregado';
      if(status === 'cancelled') return 'Cancelado';
      return 'Sin estado';
    }

    function statusClass(status){
      if(status === 'preparing') return 'preparing';
      if(status === 'delivered') return 'delivered';
      if(status === 'cancelled') return 'cancelled';
      return 'none';
    }

    function render(){
      container.innerHTML = '';

      orders.forEach(order => {
        const card = document.createElement('div');
        card.className = 'ticket';
        if(order.paid) card.classList.add('paid');
        if(order.status) card.classList.add(order.status);

        const statusBadge = order.status
          ? `<span class="badge ${statusClass(order.status)}">${statusLabel(order.status)}</span>`
          : `<span class="badge none">Sin estado</span>`;

        const paidBadge = order.paid
          ? `<span class="badge paid">Pagado</span>`
          : '';

        card.innerHTML = `
          <div class="ticket-top">
            <div class="ticket-info">
              <h2>${order.cliente}</h2>
              <div class="meta">Pedido #${order.id} · ${order.hora}</div>
            </div>
            <div class="badges">
              ${paidBadge}
              ${statusBadge}
            </div>
          </div>

          <div class="ticket-body">
            <ul class="items">
              ${order.items.map(item => `<li>${item}</li>`).join('')}
            </ul>
            <div class="total">Total: ${order.total}</div>
          </div>

          <div class="controls">
            <div class="status-row">
              <button class="btn-prep" onclick="setStatus(${order.id}, 'preparing')">Preparando</button>
              <button class="btn-del" onclick="setStatus(${order.id}, 'delivered')">Entregado</button>
              <button class="btn-can" onclick="setStatus(${order.id}, 'cancelled')">Cancelado</button>
              <button class="btn-paid" onclick="togglePaid(${order.id})">Pagado</button>
            </div>
            <button class="btn-clear" onclick="clearStatus(${order.id})">Quitar estado</button>
          </div>
        `;

        container.appendChild(card);
      });
    }

    function setStatus(id, status){
      const order = orders.find(o => o.id === id);
      if(!order) return;
      order.status = status;
      render();
    }

    function togglePaid(id){
      const order = orders.find(o => o.id === id);
      if(!order) return;
      order.paid = true;
      render();
    }

    function clearStatus(id){
      const order = orders.find(o => o.id === id);
      if(!order) return;
      order.status = '';
      render();
    }

    render();
  </script>
</body>
</html>
