<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MENÚ EL MICHI 🐱</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

:root{
  --bg:#08111f;
  --card:rgba(255,255,255,.08);
  --line:rgba(255,255,255,.10);
  --text:#fff;
  --muted:rgba(255,255,255,.75);
  --radius:24px;
  --shadow:0 15px 40px rgba(0,0,0,.25);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:'Poppins',sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at top left, rgba(96,165,250,.18), transparent 30%),
    radial-gradient(circle at bottom right, rgba(34,197,94,.15), transparent 25%),
    linear-gradient(160deg,#07101d,#0f172a);
  min-height:100vh;
  padding:12px;
  overflow-x:hidden;
  position:relative;
}

body::after{
  content:"";
  position:fixed;
  inset:0;
  background-image:
    radial-gradient(rgba(255,255,255,.08) 1px, transparent 1px);
  background-size:24px 24px;
  opacity:.12;
  pointer-events:none;
}

.container{
  max-width:500px;
  margin:auto;
  position:relative;
  z-index:2;
}

.hero{
  display:grid;
  gap:10px;
  padding:14px;
  border-radius:26px;
  margin-bottom:12px;

  background:
    linear-gradient(135deg, rgba(255,255,255,.12), rgba(255,255,255,.06)),
    radial-gradient(circle at top right, rgba(96,165,250,.25), transparent 35%);

  border:1px solid rgba(255,255,255,.10);

  box-shadow:
    0 10px 30px rgba(0,0,0,.25),
    inset 0 1px 0 rgba(255,255,255,.08);

  overflow:hidden;
  position:relative;
}

.hero::before{
  content:"";
  position:absolute;
  width:180px;
  height:180px;
  border-radius:50%;
  background:rgba(255,255,255,.05);
  top:-80px;
  right:-80px;
  filter:blur(8px);
}

.hero-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  width:50px;
  height:50px;
  border-radius:16px;
  display:grid;
  place-items:center;
  font-size:25px;

  background:linear-gradient(135deg,#60a5fa,#2563eb);

  box-shadow:
    0 0 20px rgba(96,165,250,.45),
    0 8px 20px rgba(0,0,0,.25);

  animation:float 3s ease-in-out infinite;
}

@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-4px)}
}

.brand h1{
  font-size:22px;
  font-weight:900;
  line-height:1;

  background:linear-gradient(90deg,#fff,#93c5fd);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.subtitle{
  font-size:12px;
  margin-top:4px;
  color:var(--muted);
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.stat{
  padding:10px;
  border-radius:18px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.10);
  transition:.2s;
  backdrop-filter:blur(8px);
}

.stat:hover{
  transform:translateY(-2px);
}

.label{
  font-size:11px;
  color:var(--muted);
}

.value{
  font-size:18px;
  font-weight:800;
  margin-top:2px;
}

.section{
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.08);
  border-radius:24px;
  padding:14px;
  margin-bottom:12px;
  backdrop-filter:blur(14px);
}

.section-title{
  margin-bottom:12px;
}

.section-title h2{
  font-size:18px;
}

.section-title span{
  font-size:12px;
  color:var(--muted);
}

input,select,button{
  font-family:'Poppins',sans-serif;
}

input,select{
  width:100%;
  border:none;
  outline:none;
  border-radius:18px;
  padding:12px;
  margin-top:8px;
  font-size:15px;
  background:white;
}

button{
  border:none;
  border-radius:18px;
  padding:13px;
  width:100%;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
  transition:.2s;
  position:relative;
  overflow:hidden;
}

button:hover{
  transform:translateY(-2px);
}

button:active{
  transform:scale(.98);
}

button::before{
  content:"";
  position:absolute;
  top:0;
  left:-100%;
  width:100%;
  height:100%;
  background:linear-gradient(
    120deg,
    transparent,
    rgba(255,255,255,.35),
    transparent
  );
}

button:hover::before{
  animation:shine .8s ease;
}

@keyframes shine{
  100%{
    left:120%;
  }
}

.quick-actions{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:10px;
}

.crepas{background:linear-gradient(135deg,#ffe082,#ffca28)}
.platanos{background:linear-gradient(135deg,#ffd180,#ffab40)}
.papas{background:linear-gradient(135deg,#ffab91,#ff7043)}
.hamb{background:linear-gradient(135deg,#ffccbc,#ff8a65)}
.hot{background:linear-gradient(135deg,#c5e1a5,#8bc34a)}
.frap{background:linear-gradient(135deg,#80deea,#26c6da)}

#estadoUbicacion{
  margin-top:10px;
  background:white;
  color:#111827;
  border-radius:18px;
  padding:12px;
  font-size:13px;
}

#carrito{
  background:white;
  color:#111827;
  border-radius:22px;
  padding:10px;
  min-height:100px;
  max-height:220px;
  overflow:auto;
}

#carrito p{
  background:#f8fafc;
  border-radius:16px;
  padding:12px;
  margin-bottom:8px;
  cursor:pointer;
  transition:.2s;
}

#carrito p:hover{
  background:#dbeafe;
}

.selected{
  background:#bbf7d0 !important;
  border:2px solid #22c55e;
}

#total{
  text-align:center;
  font-size:30px;
  font-weight:900;
  margin:14px 0;
}

.enviar{
  background:linear-gradient(135deg,#22c55e,#16a34a);
  color:white;
}

.eliminar{
  background:linear-gradient(135deg,#fb7185,#ef4444);
  color:white;
  margin-top:8px;
}

.vaciar{
  background:linear-gradient(135deg,#fda4af,#f87171);
  color:white;
  margin-top:8px;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  backdrop-filter:blur(8px);
  display:none;
  z-index:100;
  overflow:auto;
}

.modal-content{
  width:min(95%,500px);
  margin:20px auto;
  background:white;
  color:#111827;
  border-radius:26px;
  padding:14px;
  animation:show .25s ease;
}

@keyframes show{
  from{
    opacity:0;
    transform:translateY(20px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.top-bar{
  display:flex;
  gap:8px;
}

.top-bar button{
  background:#dbeafe;
}

#titulo{
  text-align:center;
  margin:14px 0;
  font-size:22px;
  font-weight:900;
}

#ops{
  display:grid;
  gap:8px;
}

#ops label{
  background:#f8fafc;
  padding:14px;
  border-radius:18px;
  display:flex;
  gap:10px;
  align-items:center;
  cursor:pointer;
  transition:.2s;
}

#ops label:hover{
  background:#dbeafe;
}

#ops input{
  width:auto;
  margin:0;
}

.next-btn{
  margin-top:12px;
  background:linear-gradient(135deg,#60a5fa,#2563eb);
  color:white;
}

.toast-wrap{
  position:fixed;
  bottom:14px;
  right:14px;
  display:grid;
  gap:8px;
  z-index:999;
}

.toast{
  background:#111827;
  color:white;
  padding:12px;
  border-radius:18px;
  animation:toast .25s ease forwards;
}

@keyframes toast{
  from{
    opacity:0;
    transform:translateY(10px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@media(max-width:600px){

  .quick-actions{
    grid-template-columns:1fr 1fr;
  }

  .stats{
    grid-template-columns:1fr;
  }

}

</style>
</head>

<body>

<div class="container">

  <div class="hero">

    <div class="hero-top">

      <div class="brand">

        <div class="logo">
          🐱
        </div>

        <div>
          <h1>MENÚ EL MICHI</h1>
          <div class="subtitle">
            Rápido • Moderno • Delicioso ✨
          </div>
        </div>

      </div>

    </div>

    <div class="stats">

      <div class="stat">
        <div class="label">Productos</div>
        <div class="value" id="statItems">0</div>
      </div>

      <div class="stat">
        <div class="label">Total</div>
        <div class="value" id="statTotal">$0</div>
      </div>

      <div class="stat">
        <div class="label">Entrega</div>
        <div class="value" id="statEntrega">Local</div>
      </div>

    </div>

  </div>

  <!-- RESTO DE TU HTML -->
  <!-- PEGA TODO TU CONTENIDO ACTUAL AQUÍ -->
  <!-- DESDE .section HASTA EL FINAL -->

</div>

<audio id="clickSound" preload="auto">
  <source src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3" type="audio/mpeg">
</audio>

<script>

function sonido(){

  let s=document.getElementById("clickSound");

  s.currentTime=0;
  s.play();

  if(navigator.vibrate){
    navigator.vibrate(40);
  }

}

document.addEventListener("click",(e)=>{

  if(
    e.target.tagName==="BUTTON"
  ){
    sonido();
  }

});

</script>

</body>
</html>
