<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MENÚ EL MICHI 🐱</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;}

/* FONDO PRO */
body{
font-family:Arial;
background:linear-gradient(135deg,#74ebd5,#9face6);
min-height:100vh;
}

/* CONTENEDOR */
.container{
max-width:500px;
margin:auto;
padding:15px;
background:rgba(255,255,255,0.25);
backdrop-filter:blur(12px);
border-radius:20px;
box-shadow:0 15px 40px rgba(0,0,0,0.2);
}

h1{text-align:center;margin:10px;}
h2{text-align:center;font-size:22px;font-weight:bold;}

/* BOTONES */
button{
width:100%;
padding:15px;
margin:5px 0;
font-size:18px;
border:none;
border-radius:10px;
font-weight:bold;
cursor:pointer;
transition:0.2s;
}

button:hover{
transform:scale(1.05);
box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

button:active{transform:scale(0.95);}

.crepas{background:#ffd966;}
.platanos{background:#ffb347;}
.papas{background:#ff9966;}
.hamb{background:#f6b26b;}
.hot{background:#93c47d;}
.frap{background:#76a5af;}

.enviar{
background:linear-gradient(135deg,#00c853,#43e97b);
color:white;
font-size:20px;
}

.eliminar{background:#e06666;color:white;}
.vaciar{background:#ea9999;color:white;}

/* CARRITO */
#carrito{
background:rgba(255,255,255,0.9);
padding:10px;
border-radius:15px;
margin:10px 0;
max-height:200px;
overflow:auto;
}

.item-card{
padding:10px;
margin:6px 0;
border-radius:12px;
background:#f9f9f9;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
cursor:pointer;
}

.selected{background:#d9ead3;}

/* MODAL */
.modal{
position:fixed;
top:0;left:0;
width:100%;height:100%;
display:none;
}

.modal-content{
padding:15px;
background:white;
border-radius:25px;
margin:20px;
box-shadow:0 20px 50px rgba(0,0,0,0.3);
}

.top-bar{display:flex;justify-content:space-between;}

.top-bar button{
background:#6fa8dc;
color:white;
padding:10px;
border-radius:10px;
}

#titulo{text-align:center;margin:10px 0;font-size:20px;}

#ops label{
display:block;
padding:10px;
margin:5px 0;
background:#f3f3f3;
border-radius:10px;
}
</style>
</head>

<body>

<div class="container">
<h1>🐱 MENÚ EL MICHI 🐱</h1>

<input type="text" id="cliente" placeholder="👤 Nombre del cliente"
style="width:100%;padding:10px;border-radius:10px;border:none;margin:10px 0;">

<button class="crepas" onclick="crepas()">🥞 Crepas</button>
<button class="platanos" onclick="platanos()">🍌 Plátanos</button>
<button class="papas" onclick="papas()">🍟 Papas, salchipulpos y banderillas</button>
<button class="hamb" onclick="hamb()">🍔 Hamburguesas</button>
<button class="hot" onclick="hot()">🌭 Hot Dogs</button>
<button class="frap" onclick="frap()">🥤 Frappés</button>

<div id="carrito"></div>
<h2 id="total">Total: $0</h2>

<button class="enviar" onclick="enviar()">📲 Enviar pedido</button>
<button class="eliminar" onclick="eliminar()">❌ Eliminar seleccionado</button>
<button class="vaciar" onclick="vaciar()">🗑 Vaciar todo</button>
</div>

<div id="modal" class="modal">
<div class="modal-content">
<div class="top-bar">
<button onclick="back()">⬅</button>
<button onclick="cerrar()">❌</button>
</div>
<h3 id="titulo"></h3>
<div id="ops"></div>
<button onclick="next()">Siguiente ➡️</button>
</div>
</div>

<script>
let carrito=[], seleccionado=null;
let paso=0, flujo=[], data={}, maxSel=null;

/* SONIDOS */
const sonidoClick=new Audio("https://assets.mixkit.co/sfx/preview/mixkit-select-click-1109.mp3");
const sonidoAdd=new Audio("https://assets.mixkit.co/sfx/preview/mixkit-positive-interface-beep-221.mp3");

/* FUNCIONES BASE */
function setCategoria(cat){
document.getElementById("modal").className="modal "+cat;
}

function abrir(titulo,ops,tipo,max=null){
sonidoClick.play();
document.getElementById("modal").style.display="block";
document.getElementById("titulo").innerText=titulo;
maxSel=max;

let html="";
ops.forEach(o=>{
html+=`<label><input type="${tipo}" name="opcion" value="${o}" onclick="control(this)"> ${o}</label>`;
});
document.getElementById("ops").innerHTML=html;
}

function cerrar(){document.getElementById("modal").style.display="none";}
function back(){if(paso>0){paso--;flujo[paso]();}}

function getSel(){
return [...document.querySelectorAll("#ops input:checked")].map(i=>i.value);
}

function control(input){
let checks=document.querySelectorAll("#ops input");

if(input.value==="Ninguna"||input.value==="Ninguno"){
if(input.checked) checks.forEach(c=>{if(c!==input)c.checked=false;});
}else{
checks.forEach(c=>{
if(c.value==="Ninguna"||c.value==="Ninguno") c.checked=false;
});
}

if(maxSel && getSel().length>maxSel) input.checked=false;
}

function next(){
let sel=getSel();
if(!sel.length){alert("Selecciona algo");return;}

data[flujo[paso].key]=sel;
paso++;

if(paso<flujo.length) flujo[paso]();
else{cerrar();flujo.fin();}
}

function add(txt,precio){
carrito.push({nombre:txt,precio});
render();
sonidoAdd.play();
}

function render(){
let div=document.getElementById("carrito");
div.innerHTML="";
let total=0;

carrito.forEach((i,idx)=>{
div.innerHTML+=`
<div onclick="seleccionar(${idx})" class="item-card ${seleccionado===idx?'selected':''}">
$${i.precio}<br>${i.nombre.replace(/\n/g,"<br>")}
</div>`;
total+=i.precio;
});

document.getElementById("total").innerText="Total: $"+total;
}

function seleccionar(i){seleccionado=i;render();}
function eliminar(){if(seleccionado!=null){carrito.splice(seleccionado,1);seleccionado=null;render();}}
function vaciar(){carrito=[];render();}

/* CREPAS */
function crepas(){
setCategoria("crepas");
paso=0;data={};

flujo=[
()=>abrir("Bases",["Nutella","Lechera","Cajeta","Queso Philadelphia","Mermelada de fresa","Mermelada de zarzamora"],"checkbox",2),
()=>abrir("Frutas",["Fresa","Plátano","Durazno","Uva","Ninguna"],"checkbox"),
];

flujo[0].key="bases";
flujo[1].key="frutas";

flujo.fin=function(){
let b=data.bases||[];
let f=(data.frutas||[]).filter(x=>x!="Ninguna");

let precio=30;
if(b.length==1 && f.length==1)precio=40;
else if(b.length>=1 && f.length>=3)precio=50;

let txt="Crepa\nBase: "+b.join(", ");
if(f.length) txt+="\nFruta: "+f.join(", ");
txt+="\nPrecio: $"+precio;

add(txt,precio);
};

flujo[0]();
}

/* DEMÁS BOTONES SIMPLES PARA QUE TODO FUNCIONE */
function platanos(){add("Plátanos",30);}
function papas(){add("Papas",35);}
function hamb(){add("Hamburguesa",60);}
function hot(){add("Hot Dog",20);}
function frap(){add("Frappé",30);}

/* ENVIAR */
function enviar(){
let nombre=document.getElementById("cliente").value || "Cliente";
let txt="Pedido "+nombre+"%0A";
let total=0;

carrito.forEach(i=>{
txt+=i.nombre+"%0A";
total+=i.precio;
});

txt+="Total: $"+total;
window.open("https://wa.me/525532416109?text="+txt);
}
</script>

</body>
</html>
