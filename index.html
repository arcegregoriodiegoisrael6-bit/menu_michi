<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MENÚ EL MICHI 🐱</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Arial;background:#c9daf8;}

.container{max-width:500px;margin:auto;padding:10px;}

h1{text-align:center;margin:10px;}
h2{text-align:center;}

button{
width:100%;
padding:15px;
margin:5px 0;
font-size:18px;
border:none;
border-radius:10px;
font-weight:bold;
cursor:pointer;
}

.crepas{background:#ffd966;}
.platanos{background:#ffb347;}
.papas{background:#ff9966;}
.hamb{background:#f6b26b;}
.hot{background:#93c47d;}
.frap{background:#76a5af;}

.enviar{background:#6fa8dc;color:white;}
.eliminar{background:#e06666;color:white;}
.vaciar{background:#ea9999;color:white;}

#carrito{
background:white;
padding:10px;
border-radius:10px;
margin:10px 0;
max-height:200px;
overflow:auto;
}

.selected{background:#d9ead3;}

.modal{
position:fixed;
top:0;left:0;
width:100%;height:100%;
display:none;
overflow:auto;
}

.modal-content{
padding:15px;
background:white;
border-radius:20px;
margin:20px;
box-shadow:0 10px 25px rgba(0,0,0,0.25);
}

.top-bar{display:flex;justify-content:space-between;}

.top-bar button{
background:#6fa8dc;
color:white;
padding:10px;
border-radius:10px;
}

#titulo{text-align:center;margin:10px 0;font-size:20px;}

#ops label{
display:block;
padding:10px;
margin:5px 0;
background:#f3f3f3;
border-radius:10px;
}

.modal-content button:last-child{
margin-top:10px;
background:#6fa8dc;
color:white;
padding:12px;
border-radius:10px;
font-weight:bold;
}
</style>
</head>

<body>

<div class="container">
<h1>🐱 MENÚ EL MICHI 🐱</h1>

<button class="crepas" onclick="crepas()">🥞 Crepas</button>
<button class="platanos" onclick="platanos()">🍌 Plátanos</button>
<button class="papas" onclick="papas()">🍟 Papas, salchipulpos y banderillas</button>
<button class="hamb" onclick="hamb()">🍔 Hamburguesas</button>
<button class="hot" onclick="hot()">🌭 Hot Dogs</button>
<button class="frap" onclick="frap()">🥤 Frappés</button>

<div id="carrito"></div>
<h2 id="total">Total: $0</h2>

<button class="enviar" onclick="enviar()">📲 Enviar pedido</button>
<button class="eliminar" onclick="eliminar()">❌ Eliminar seleccionado</button>
<button class="vaciar" onclick="vaciar()">🗑 Vaciar todo</button>
</div>

<div id="modal" class="modal">
<div class="modal-content">
<div class="top-bar">
<button onclick="back()">⬅</button>
<button onclick="cerrar()">❌</button>
</div>
<h3 id="titulo"></h3>
<div id="ops"></div>
<button onclick="next()">Siguiente ➡️</button>
</div>
</div>

<script>

let carrito=[], seleccionado=null;
let paso=0, flujo=[], data={}, maxSel=null;

function setCategoria(cat){
document.getElementById("modal").className="modal "+cat;
document.getElementById("modal").style.display="block";
}

function abrir(titulo,ops,tipo,max=null){
maxSel=max;
document.getElementById("titulo").innerText=titulo;

let html="";
ops.forEach(o=>{
html+=`<label><input type="${tipo}" value="${o}" onclick="control(this)"> ${o}</label>`;
});
document.getElementById("ops").innerHTML=html;
}

function cerrar(){document.getElementById("modal").style.display="none";}
function back(){if(paso>0){paso--;flujo[paso]();}}

function getSel(){
return [...document.querySelectorAll("#ops input:checked")].map(i=>i.value);
}

function control(input){
let checks=document.querySelectorAll("#ops input");

if(input.checked){
if(input.value.includes("Ninguno")) checks.forEach(c=>c.checked=false);
else checks.forEach(c=>{if(c.value.includes("Ninguno")) c.checked=false});
}

if(maxSel && getSel().length>maxSel) input.checked=false;
}

function next(){
let sel=getSel();
if(!sel.length){alert("Selecciona algo");return;}

data[flujo[paso].key]=sel;
paso++;

if(paso<flujo.length) flujo[paso]();
else{cerrar();flujo.fin();}
}

function add(txt,precio){
carrito.push({nombre:txt,precio});
render();
}

function render(){
let div=document.getElementById("carrito");
div.innerHTML="";
let total=0;

carrito.forEach((i,idx)=>{
div.innerHTML+=`<p onclick="seleccionar(${idx})" class="${seleccionado===idx?'selected':''}">
$${i.precio} - ${i.nombre.replace(/\n/g,"<br>")}
</p>`;
total+=i.precio;
});

document.getElementById("total").innerText="Total: $"+total;
}

function seleccionar(i){seleccionado=i;render();}
function eliminar(){if(seleccionado!=null){carrito.splice(seleccionado,1);seleccionado=null;render();}}
function vaciar(){carrito=[];seleccionado=null;render();}

/* ================= CREPAS (FUNCIONAL ORIGINAL) ================= */
function crepas(){
setCategoria("crepas");
paso=0;data={};

flujo=[
()=>abrir("Bases",["Nutella","Lechera","Cajeta","Queso Philadelphia","Mermelada de fresa","Mermelada de zarzamora"],"checkbox",2),
()=>abrir("Frutas",["Fresa","Plátano","Durazno","Uva","Ninguna"],"checkbox"),
()=>abrir("Decoración",["Chocolate Hershey's","Lechera","Ninguna"],"radio"),
()=>abrir("Toppings",["Granillo de chocolate","Granillo de arcoiris","Gotas de chocolate","Nuez","Lunetitas","Ninguno"],"radio")
];

flujo[0].key="bases";
flujo[1].key="frutas";
flujo[2].key="dec";
flujo[3].key="top";

flujo.fin=function(){

let b=data.bases||[];
let f=(data.frutas||[]).filter(x=>x!="Ninguna");

let nb=b.length,nf=f.length;
let precio=30;

if((nb==1&&nf>=3)||(nb==2&&nf==2))precio=50;
else if(nb==1&&nf==1)precio=40;
else if(nb==2&&nf==0)precio=35;
else if((nb==1&&nf==2)||(nb==2&&nf==1))precio=45;

let txt="Crepa\nBase: "+b.join(", ");
if(data.frutas) txt+="\nFruta: "+data.frutas.join(", ");
if(data.dec) txt+="\nDecoración: "+data.dec;
if(data.top) txt+="\nToppings: "+data.top;

txt+="\nPrecio: $"+precio;
add(txt,precio);
};

flujo[0]();
}

/* ================= PLATANOS ================= */
function platanos(){
setCategoria("platanos");
paso=0;data={};

flujo=[
()=>abrir("Tipo",["Fritos $30","Árabes $40"],"radio"),
()=>abrir("Complementos",["Crema","Lechera","Mermelada de fresa","Ninguna"],"checkbox"),
()=>abrir("Toppings",["Granillo de chocolate","Granillo de arcoiris","Nuez","Lunetitas","Gotas de chocolate","Ninguno"],"radio")
];

flujo[0].key="tipo";
flujo[1].key="comp";
flujo[2].key="top";

flujo.fin=function(){
let precio=data.tipo[0]=="Fritos"?30:40;

let txt="Plátanos "+data.tipo;
if(data.comp) txt+="\nComplementos: "+data.comp.join(", ");
if(data.top) txt+="\nToppings: "+data.top;

txt+="\nPrecio: $"+precio;
add(txt,precio);
};

flujo[0]();
}

/* ================= PAPAS ================= */
function papas(){
setCategoria("papas");
paso=0;data={};

flujo=[
()=>abrir("Tipo",["Papas a la francesa $35","Salchipulpos con papas $45","Banderilla con papas $35","Banderilla sola $25"],"radio"),
()=>abrir("Aderezos",["Catsup","Queso amarillo","Salsa","Ninguna"],"checkbox")
];

flujo[0].key="tipo";
flujo[1].key="ad";

flujo.fin=function(){
let precios={
"Papas a la francesa $35":35,
"Salchipulpos con papas $45":45,
"Banderilla con papas $35":35,
"Banderilla sola $25":25
};

let t=data.tipo[0];
let txt=t;

if(data.ad) txt+="\nAderezos: "+data.ad.join(", ");

txt+="\nPrecio: $"+precios[t];
add(txt,precios[t]);
};

flujo[0]();
}

/* ================= HAMBURGUESAS ================= */
function hamb(){
setCategoria("hamb");
paso=0;data={};

flujo=[
()=>abrir("Tipo",["Clásica $55","Hawaiana $60","Especial $65"],"radio"),
()=>abrir("Extras",["Piña $8","Tocino $8","Salchicha $8","Carne $10","Ninguna"],"checkbox"),
()=>abrir("Con papas",["Con papas +$10","Sin papas"],"radio")
];

flujo[0].key="tipo";
flujo[1].key="extra";
flujo[2].key="papas";

flujo.fin=function(){

let base={"Clásica $55":55,"Hawaiana $60":60,"Especial $65":65};

let precio=base[data.tipo[0]];

if(data.papas[0]=="Con papas +$10") precio+=10;

(data.extra||[]).forEach(e=>{
if(e.includes("$")) precio+=parseInt(e.split("$")[1]);
});

let txt=data.tipo[0];

if(data.extra) txt+="\nExtras: "+data.extra.join(", ");

txt+="\nPrecio: $"+precio;

add(txt,precio);
};

flujo[0]();
}

/* ================= HOT DOGS ================= */
function hot(){
setCategoria("hot");
paso=0;data={};

flujo=[
()=>abrir("Tipo",["Sencillo","Especial"],"radio"),
()=>abrir("Cantidad",["1","2","3"],"radio"),
()=>abrir("Sin ingredientes",["Mayonesa","Catsup","Cebolla","Ninguna"],"checkbox")
];

flujo[0].key="tipo";
flujo[1].key="cant";
flujo[2].key="sin";

flujo.fin=function(){
let tipo=data.tipo[0];
let cant=parseInt(data.cant[0]);

let precio=tipo=="Sencillo"
?{1:20,2:40,3:55}[cant]
:{1:25,2:50,3:70}[cant];

let txt=`Hot Dog ${tipo} x${cant}`;
if(data.sin) txt+="\nSin: "+data.sin.join(", ");

txt+="\nPrecio: $"+precio;

add(txt,precio);
};

flujo[0]();
}

/* ================= FRAPPES (ARREGLADO COMPLETO) ================= */
function frap(){
setCategoria("frap");
paso=0;data={};

flujo=[
()=>abrir("Tipo",["Oreo","Mazapán","Frapuccino","Fresa"],"radio"),

()=> {
if(data.tipo[0]=="Fresa"){
abrir("Tamaño",["Chico $35","Grande $60"],"radio");
}else{
abrir("Tamaño",["Chico $30","Grande $50"],"radio");
}
}
];

flujo[0].key="tipo";
flujo[1].key="tam";

flujo.fin=function(){

let tipo=data.tipo[0];
let tam=data.tam[0];

let precio=0;

if(tipo=="Fresa"){
precio = tam.includes("35") ? 35 : 60;
}else{
precio = tam.includes("30") ? 30 : 50;
}

let txt=`Frappé ${tipo} (${tam.split(" ")[0]})`;
txt+=`\nPrecio: $${precio}`;

add(txt,precio);
};

flujo[0]();
}

/* ================= ENVIAR ================= */
function enviar(){
if(carrito.length==0){alert("Carrito vacío");return;}

let txt="🧾 Pedido - El Michi 🐱%0A%0A";
let total=0;

carrito.forEach(i=>{
txt+=i.nombre.replace(/\n/g,"%0A")+"%0A%0A";
total+=i.precio;
});

txt+="💰 Total: $"+total;

window.open("https://wa.me/525532416109?text="+txt);
}

</script>

</body>
</html>
