<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🐱 EL MICHI FOOD</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
--bg1:#0f172a;
--bg2:#111827;
--glass:rgba(255,255,255,.12);
--white:#fff;
--shadow:0 15px 40px rgba(0,0,0,.35);
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
background:
radial-gradient(circle at top left,#22c55e33,transparent 30%),
radial-gradient(circle at top right,#3b82f633,transparent 30%),
linear-gradient(135deg,var(--bg1),var(--bg2));
min-height:100vh;
padding:15px;
color:white;
}

.container{
max-width:700px;
margin:auto;
background:var(--glass);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.1);
border-radius:30px;
padding:18px;
box-shadow:var(--shadow);
}

.logo{
text-align:center;
font-size:34px;
font-weight:800;
margin-top:5px;
}

.sub{
text-align:center;
opacity:.8;
margin-bottom:15px;
font-size:14px;
}

input,select{
width:100%;
padding:15px;
margin:6px 0;
border:none;
border-radius:16px;
font-size:16px;
outline:none;
background:white;
color:#111827;
}

.section{
margin-top:12px;
margin-bottom:8px;
font-size:18px;
font-weight:700;
}

#estadoUbicacion{
background:rgba(255,255,255,.1);
padding:12px;
border-radius:14px;
font-size:13px;
margin-bottom:12px;
line-height:1.5;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

button{
width:100%;
border:none;
padding:16px;
border-radius:18px;
font-size:16px;
font-weight:700;
cursor:pointer;
transition:.2s;
color:white;
box-shadow:0 8px 20px rgba(0,0,0,.2);
}

button:hover{
transform:translateY(-2px);
}

.crepas{background:linear-gradient(135deg,#ffb347,#ffcc33);}
.platanos{background:linear-gradient(135deg,#f6d365,#fda085);}
.papas{background:linear-gradient(135deg,#ff7e5f,#feb47b);}
.hamb{background:linear-gradient(135deg,#ff6b6b,#ff9ff3);}
.hot{background:linear-gradient(135deg,#43cea2,#185a9d);}
.frap{background:linear-gradient(135deg,#4facfe,#00f2fe);}

.enviar{
background:linear-gradient(135deg,#22c55e,#16a34a);
margin-top:10px;
}

.eliminar{
background:linear-gradient(135deg,#fb7185,#ef4444);
}

.vaciar{
background:linear-gradient(135deg,#f97316,#dc2626);
}

#carrito{
background:white;
color:#111827;
padding:12px;
border-radius:20px;
margin:12px 0;
min-height:120px;
max-height:300px;
overflow:auto;
}

.item{
padding:10px;
border-radius:12px;
margin-bottom:8px;
cursor:pointer;
transition:.2s;
border:1px solid #eee;
}

.item:hover{
background:#f3f4f6;
}

.selected{
background:#dcfce7 !important;
border:2px solid #22c55e;
}

.total{
font-size:24px;
font-weight:800;
text-align:center;
margin:10px 0;
}

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.6);
display:none;
padding:15px;
overflow:auto;
z-index:999;
}

.modal-content{
background:white;
color:#111827;
border-radius:25px;
padding:18px;
max-width:650px;
margin:auto;
animation:show .2s ease;
}

@keyframes show{
from{
opacity:0;
transform:scale(.9);
}
to{
opacity:1;
transform:scale(1);
}
}

.top{
display:flex;
gap:10px;
margin-bottom:10px;
}

.top button{
background:#3b82f6;
}

#titulo{
text-align:center;
font-size:22px;
font-weight:800;
margin:12px 0;
}

#ops{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-bottom:14px;
}

#ops label{
display:flex;
gap:10px;
align-items:center;
padding:14px;
background:#f3f4f6;
border-radius:14px;
cursor:pointer;
}

.next{
background:#22c55e;
}

#toast{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
background:#111827;
padding:14px 18px;
border-radius:999px;
font-size:14px;
opacity:0;
transition:.2s;
pointer-events:none;
}

#toast.show{
opacity:1;
}

@media(max-width:600px){

.grid{
grid-template-columns:1fr;
}

#ops{
grid-template-columns:1fr;
}

}

</style>
</head>

<body>

<div class="container">

<div class="logo">🐱 EL MICHI FOOD</div>
<div class="sub">Snacks • Hamburguesas • Frappés • Pedido por WhatsApp</div>

<div class="section">🚚 Tipo de pedido</div>

<select id="tipoEntrega">
<option value="Recoger en local">🏪 Recoger en local</option>
<option value="A domicilio">🏠 A domicilio</option>
</select>

<input type="text" id="nombreCliente" placeholder="👤 Nombre del cliente">

<select id="pago">
<option>Efectivo</option>
<option>Transferencia</option>
</select>

<div id="estadoUbicacion">
📍 Si eliges a domicilio se solicitará tu ubicación
</div>

<div class="grid">

<button class="crepas" onclick="simple('🥞 Crepa especial',45)">🥞 Crepas</button>

<button class="platanos" onclick="simple('🍌 Plátanos preparados',40)">🍌 Plátanos</button>

<button class="papas" onclick="simple('🍟 Papas especiales',35)">🍟 Papas</button>

<button class="hamb" onclick="simple('🍔 Hamburguesa especial',65)">🍔 Hamburguesas</button>

<button class="hot" onclick="simple('🌭 Hot Dog especial',25)">🌭 Hot Dogs</button>

<button class="frap" onclick="simple('🥤 Frappé grande',50)">🥤 Frappés</button>

</div>

<div id="carrito"></div>

<div class="total" id="total">
Total: $0
</div>

<button class="enviar" onclick="enviar()">
📲 Enviar pedido
</button>

<button class="eliminar" onclick="eliminar()">
❌ Eliminar seleccionado
</button>

<button class="vaciar" onclick="vaciar()">
🗑 Vaciar carrito
</button>

</div>

<div id="toast"></div>

<script>

let carrito=JSON.parse(localStorage.getItem("carrito")) || [];

let seleccionado=null;

let ubicacionGuardada=null;

render();

function toast(msg){

let t=document.getElementById("toast");

t.innerText=msg;

t.classList.add("show");

setTimeout(()=>{

t.classList.remove("show");

},2000);

}

function money(n){

return "$"+n;

}

function simple(nombre,precio){

carrito.push({
nombre,
precio
});

localStorage.setItem("carrito",JSON.stringify(carrito));

render();

toast("✅ Producto agregado");

}

function render(){

let div=document.getElementById("carrito");

div.innerHTML="";

let total=0;

if(carrito.length===0){

div.innerHTML=`
<div style="text-align:center;padding:25px;color:#666;">
🛒 Tu carrito está vacío
</div>
`;

}

carrito.forEach((i,idx)=>{

div.innerHTML+=`

<div
class="item ${seleccionado===idx?'selected':''}"
onclick="seleccionar(${idx})"
>

${i.nombre}
<br><br>

<b>${money(i.precio)}</b>

</div>

`;

total+=i.precio;

});

document.getElementById("total").innerText=
"Total: "+money(total);

}

function seleccionar(i){

seleccionado=i;

render();

}

function eliminar(){

if(seleccionado!=null){

carrito.splice(seleccionado,1);

localStorage.setItem("carrito",JSON.stringify(carrito));

seleccionado=null;

render();

toast("❌ Producto eliminado");

}

}

function vaciar(){

carrito=[];

localStorage.removeItem("carrito");

seleccionado=null;

render();

toast("🗑 Carrito vaciado");

}

function totalCarrito(){

return carrito.reduce((a,b)=>a+b.precio,0);

}

function obtenerUbicacionActual(){

return new Promise((resolve,reject)=>{

if(!navigator.geolocation){

alert("Tu navegador no permite ubicación");

reject();

return;

}

navigator.geolocation.getCurrentPosition(

(pos)=>{

let lat=pos.coords.latitude;

let lon=pos.coords.longitude;

ubicacionGuardada={

lat,
lon,

link:`https://www.google.com/maps?q=${lat},${lon}`

};

resolve(ubicacionGuardada);

},

(error)=>{

if(error.code===1){

alert("⚠️ Debes permitir la ubicación.");

}else if(error.code===2){

alert("⚠️ No se pudo detectar tu ubicación.");

}else if(error.code===3){

alert("⚠️ La ubicación tardó demasiado.");

}

reject(error);

},

{
enableHighAccuracy:true,
timeout:20000,
maximumAge:0
}

);

});

}

document.getElementById("tipoEntrega")
.addEventListener("change",async function(){

if(this.value==="A domicilio"){

document.getElementById("estadoUbicacion").innerText=
"📍 Solicitando ubicación...";

try{

await obtenerUbicacionActual();

document.getElementById("estadoUbicacion").innerText=
"✅ Ubicación activada correctamente";

}catch{

document.getElementById("estadoUbicacion").innerText=
"❌ Debes permitir la ubicación";

}

}else{

document.getElementById("estadoUbicacion").innerText=
"📍 Si eliges a domicilio se solicitará tu ubicación";

}

});

async function enviar(){

if(carrito.length===0){

alert("Agrega productos");

return;

}

let nombre=document.getElementById("nombreCliente").value.trim();

if(nombre===""){

alert("Escribe tu nombre");

return;

}

let entrega=document.getElementById("tipoEntrega").value;

let pago=document.getElementById("pago").value;

let total=totalCarrito();

if(entrega==="A domicilio" && total<100){

alert("🛵 El mínimo para domicilio es de $100");

return;

}

let txt="🧾 PEDIDO EL MICHI 🐱\n\n";

txt+="👤 Cliente: "+nombre+"\n";

txt+="🚚 Entrega: "+entrega+"\n";

txt+="💳 Pago: "+pago+"\n\n";

if(pago==="Transferencia"){

txt+="🏦 DATOS PARA TRANSFERENCIA\n";

txt+="Banco: BBVA\n";

txt+="Cuenta: 1234567890\n";

txt+="CLABE: 123456789012345678\n";

txt+="Nombre: EL MICHI\n";

txt+="📸 Envía tu comprobante\n\n";

}

carrito.forEach(i=>{

txt+=i.nombre+" - "+money(i.precio)+"\n";

});

txt+="\n";

if(entrega==="A domicilio"){

if(!ubicacionGuardada){

try{

await obtenerUbicacionActual();

}catch{

return;

}

}

txt+="📍 Ubicación:\n";

txt+=ubicacionGuardada.link+"\n\n";

}

txt+="💰 TOTAL: "+money(total);

toast("📲 Abriendo WhatsApp...");

let telefono="525532416109";

let mensaje=encodeURIComponent(txt);

window.location.href=
"whatsapp://send?phone="+telefono+"&text="+mensaje;

setTimeout(()=>{

if(document.visibilityState==="visible"){

window.location.href=
"https://wa.me/"+telefono+"?text="+mensaje;

}

},1000);

carrito=[];

localStorage.removeItem("carrito");

seleccionado=null;

render();

}

</script>

</body>
</html>
