<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MENÚ EL MICHI 🐱</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Arial;background:#c9daf8;}

.container{max-width:500px;margin:auto;padding:10px;}

h1{text-align:center;margin:10px;}
h2{text-align:center;}

button{
width:100%;
padding:15px;
margin:5px 0;
font-size:18px;
border:none;
border-radius:10px;
font-weight:bold;
cursor:pointer;
}

.crepas{background:#ffd966;}
.platanos{background:#ffb347;}
.papas{background:#ff9966;}
.hamb{background:#f6b26b;}
.hot{background:#93c47d;}
.frap{background:#76a5af;}

.enviar{background:#6fa8dc;color:white;}
.eliminar{background:#e06666;color:white;}
.vaciar{background:#ea9999;color:white;}

#carrito{
background:white;
padding:10px;
border-radius:10px;
margin:10px 0;
max-height:200px;
overflow:auto;
}

.selected{background:#d9ead3;}

.modal{
position:fixed;
top:0;left:0;
width:100%;height:100%;
display:none;
overflow:auto;
}

.modal-content{
padding:15px;
background:white;
border-radius:20px;
margin:20px;
box-shadow:0 10px 25px rgba(0,0,0,0.25);
}

.top-bar{display:flex;justify-content:space-between;}

.top-bar button{
background:#6fa8dc;
color:white;
padding:10px;
border-radius:10px;
}

#titulo{text-align:center;margin:10px 0;font-size:20px;}

#ops label{
display:block;
padding:10px;
margin:5px 0;
background:#f3f3f3;
border-radius:10px;
}

.modal-content button:last-child{
margin-top:10px;
background:#6fa8dc;
color:white;
padding:12px;
border-radius:10px;
font-weight:bold;
}
</style>
</head>

<body>

<div class="container">
<h1>🐱 MENÚ EL MICHI 🐱</h1>

<button class="crepas" onclick="crepas()">🥞 Crepas</button>
<button class="platanos" onclick="platanos()">🍌 Plátanos</button>
<button class="papas" onclick="papas()">🍟 Papas, salchipulpos y banderillas</button>
<button class="hamb" onclick="hamb()">🍔 Hamburguesas</button>
<button class="hot" onclick="hot()">🌭 Hot Dogs</button>
<button class="frap" onclick="frap()">🥤 Frappés</button>

<div id="carrito"></div>
<h2 id="total">Total: $0</h2>

<button class="enviar" onclick="enviar()">📲 Enviar pedido</button>
<button class="eliminar" onclick="eliminar()">❌ Eliminar seleccionado</button>
<button class="vaciar" onclick="vaciar()">🗑 Vaciar todo</button>
</div>

<div id="modal" class="modal">
<div class="modal-content">
<div class="top-bar">
<button onclick="back()">⬅</button>
<button onclick="cerrar()">❌</button>
</div>
<h3 id="titulo"></h3>
<div id="ops"></div>
<button onclick="next()">Siguiente ➡️</button>
</div>
</div>

<script>
let carrito=[], seleccionado=null;
let paso=0, flujo=[], data={}, maxSel=null;

function setCategoria(cat){
document.getElementById("modal").className="modal "+cat;
document.getElementById("modal").style.display="block";
}

function abrir(titulo,ops,tipo,max=null){
maxSel=max;
document.getElementById("titulo").innerText=titulo;

let html="";
ops.forEach(o=>{
html+=`<label><input type="${tipo}" value="${o}" onclick="control(this)"> ${o}</label>`;
});
document.getElementById("ops").innerHTML=html;
}

function cerrar(){document.getElementById("modal").style.display="none";}
function back(){if(paso>0){paso--;flujo[paso]();}}

function getSel(){
return [...document.querySelectorAll("#ops input:checked")].map(i=>i.value);
}

function control(input){
let checks=document.querySelectorAll("#ops input");

if(input.checked){
if(input.value.includes("Ninguno")) checks.forEach(c=>c.checked=false);
else checks.forEach(c=>{if(c.value.includes("Ninguno")) c.checked=false});
}

if(maxSel && getSel().length>maxSel) input.checked=false;
}

function next(){
let sel=getSel();
if(!sel.length){alert("Selecciona algo");return;}

data[flujo[paso].key]=sel;
paso++;

if(paso<flujo.length) flujo[paso]();
else{cerrar();flujo.fin();}
}

function add(txt,precio){
carrito.push({nombre:txt,precio});
render();
}

function render(){
let div=document.getElementById("carrito");
div.innerHTML="";
let total=0;

carrito.forEach((i,idx)=>{
div.innerHTML+=`<p onclick="seleccionar(${idx})" class="${seleccionado===idx?'selected':''}">
$${i.precio} - ${i.nombre.replace(/\n/g,"<br>")}
</p>`;
total+=i.precio;
});

document.getElementById("total").innerText="Total: $"+total;
}

function seleccionar(i){seleccionado=i;render();}
function eliminar(){if(seleccionado!=null){carrito.splice(seleccionado,1);seleccionado=null;render();}}
function vaciar(){carrito=[];seleccionado=null;render();}

/* ================= HOT DOGS ================= */
function hot(){
setCategoria("hot");
paso=0;data={};

flujo=[
()=>abrir("Tipo de Hot Dog",["Sencillo","Especial"],"radio"),
()=> {
if(data.tipo[0]==="Sencillo"){
abrir("Cantidad",["1 $20","2 $40","3 $55"],"radio");
}else{
abrir("Cantidad",["1 $25","2 $50","3 $70"],"radio");
}
},
()=>abrir("Omitir ingredientes",["Mayonesa","Catsup","Jitomate","Chile jalapeño","Cebolla","Ninguna"],"checkbox")
];

flujo[0].key="tipo";
flujo[1].key="cant";
flujo[2].key="sin";

flujo.fin=function(){
let tipo=data.tipo[0];
let cant=data.cant[0];

let precio=0;

if(tipo==="Sencillo"){
if(cant.includes("1")) precio=20;
if(cant.includes("2")) precio=40;
if(cant.includes("3")) precio=55;
}else{
if(cant.includes("1")) precio=25;
if(cant.includes("2")) precio=50;
if(cant.includes("3")) precio=70;
}

let txt=`Hot Dog ${tipo} x${cant.split(" ")[0]}`;

let sin=data.sin||[];
if(sin.length) txt+="\nSin: "+sin.join(", ");

txt+="\nPrecio: $"+precio;

add(txt,precio);
};

flujo[0]();
}

/* ================= FRAPPES (ARREGLADO) ================= */
function frap(){
setCategoria("frap");
paso=0;data={};

flujo=[
()=>abrir("Tipo de Frappé",["Oreo","Mazapán","Frapuccino","Fresa"],"radio"),

()=> {
if(data.tipo[0]==="Fresa"){
abrir("¿Qué tamaño?",["Chico $35","Grande $60"],"radio");
}else{
abrir("¿Qué tamaño?",["Chico $30","Grande $50"],"radio");
}
}
];

flujo[0].key="tipo";
flujo[1].key="tam";

flujo.fin=function(){
let tipo=data.tipo[0];
let tam=data.tam[0];

let precio=0;

if(tipo==="Fresa"){
if(tam.includes("Chico")) precio=35;
if(tam.includes("Grande")) precio=60;
}else{
if(tam.includes("Chico")) precio=30;
if(tam.includes("Grande")) precio=50;
}

let txt=`Frappé ${tipo} (${tam.split(" ")[0]})`;
txt+=`\nPrecio: $${precio}`;

add(txt,precio);
};

flujo[0]();
}

/* ENVIAR */
function enviar(){
if(carrito.length===0){alert("Carrito vacío");return;}

let txt="🧾 Pedido - El Michi 🐱%0A%0A";
let total=0;

carrito.forEach(i=>{
txt+=i.nombre.replace(/\n/g,"%0A")+"%0A%0A";
total+=i.precio;
});

txt+="💰 Total: $"+total;

window.open("https://wa.me/525532416109?text="+txt);
}
</script>

</body>
</html>
