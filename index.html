<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🐱 MENÚ EL MICHI</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
background:linear-gradient(135deg,#89f7fe,#66a6ff);
min-height:100vh;
padding:10px;
}

.container{
max-width:550px;
margin:auto;
}

.logo{
text-align:center;
font-size:34px;
font-weight:700;
color:white;
margin:15px 0;
text-shadow:0 4px 10px rgba(0,0,0,0.3);
}

.subtitle{
text-align:center;
color:white;
margin-bottom:20px;
font-size:15px;
}

.card{
background:rgba(255,255,255,0.95);
backdrop-filter:blur(10px);
padding:15px;
border-radius:25px;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
margin-bottom:15px;
}

input,select{
width:100%;
padding:14px;
border:none;
border-radius:14px;
margin:7px 0;
font-size:15px;
background:#f3f3f3;
outline:none;
}

h2{
margin:10px 0;
font-size:20px;
color:#333;
}

button{
width:100%;
border:none;
padding:14px;
margin:8px 0;
border-radius:18px;
font-size:17px;
font-weight:600;
cursor:pointer;
transition:0.25s;
color:white;
box-shadow:0 5px 15px rgba(0,0,0,0.15);
}

button:hover{
transform:translateY(-3px) scale(1.01);
}

.menu-btn{
overflow:hidden;
padding:0;
background:white;
color:#333;
}

.menu-btn img{
width:100%;
height:130px;
object-fit:cover;
display:block;
}

.menu-text{
padding:12px;
font-size:18px;
font-weight:700;
}

.crepas{background:#ffd966;}
.platanos{background:#ffb347;}
.papas{background:#ff9966;}
.hamb{background:#f6b26b;}
.hot{background:#93c47d;}
.frap{background:#76a5af;}

#carrito{
background:white;
border-radius:20px;
padding:10px;
max-height:300px;
overflow:auto;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.item{
padding:10px;
border-bottom:1px solid #eee;
cursor:pointer;
border-radius:10px;
transition:0.2s;
}

.item:hover{
background:#f5f5f5;
}

.selected{
background:#d9ead3 !important;
border:2px solid #6aa84f;
}

.total{
text-align:center;
font-size:24px;
font-weight:700;
margin-top:10px;
color:#333;
}

.enviar{
background:linear-gradient(135deg,#00c853,#00e676);
}

.eliminar{
background:linear-gradient(135deg,#ff5252,#ff1744);
}

.vaciar{
background:linear-gradient(135deg,#ff8a80,#ff5252);
}

.modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.5);
display:none;
overflow:auto;
z-index:999;
padding:20px;
}

.modal-content{
background:white;
border-radius:25px;
padding:20px;
max-width:500px;
margin:auto;
animation:show 0.25s ease;
}

@keyframes show{
from{
transform:scale(0.9);
opacity:0;
}
to{
transform:scale(1);
opacity:1;
}
}

.top{
display:flex;
justify-content:space-between;
gap:10px;
}

.top button{
padding:10px;
}

#titulo{
text-align:center;
margin:15px 0;
font-size:24px;
}

#ops label{
display:block;
background:#f5f5f5;
padding:14px;
margin:8px 0;
border-radius:15px;
cursor:pointer;
transition:0.2s;
}

#ops label:hover{
background:#ececec;
}

.estado{
background:white;
padding:12px;
border-radius:15px;
margin:10px 0;
font-size:14px;
line-height:1.5;
}

.toast{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
background:#333;
color:white;
padding:14px 20px;
border-radius:50px;
font-size:15px;
display:none;
z-index:9999;
animation:fade 0.3s ease;
}

@keyframes fade{
from{
opacity:0;
transform:translateX(-50%) translateY(20px);
}
to{
opacity:1;
transform:translateX(-50%) translateY(0);
}
}

.whatsapp{
position:fixed;
bottom:20px;
right:20px;
background:#25d366;
width:65px;
height:65px;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
font-size:32px;
color:white;
text-decoration:none;
box-shadow:0 5px 15px rgba(0,0,0,0.3);
z-index:999;
}

</style>
</head>

<body>

<div class="container">

<div class="logo">
🐱 MENÚ EL MICHI
</div>

<div class="subtitle">
La comida más rica de la zona 😋
</div>

<div class="card">

<h2>🚚 Tipo de pedido</h2>

<select id="tipoEntrega">
<option value="Recoger en local">🏪 Recoger en local</option>
<option value="A domicilio">🏠 A domicilio</option>
</select>

<input type="text" id="nombreCliente" placeholder="👤 Nombre del cliente">

<select id="pago">
<option>Efectivo</option>
<option>Transferencia</option>
</select>

<div class="estado" id="estadoUbicacion">
📍 Si eliges envío a domicilio se pedirá tu ubicación
</div>

</div>

<button class="menu-btn" onclick="crepas()">
<img src="https://images.unsplash.com/photo-1519676867240-f03562e64548?q=80&w=1200&auto=format&fit=crop">
<div class="menu-text crepas">🥞 Crepas</div>
</button>

<button class="menu-btn" onclick="platanos()">
<img src="https://images.unsplash.com/photo-1603833665858-e61d17a86224?q=80&w=1200&auto=format&fit=crop">
<div class="menu-text platanos">🍌 Plátanos</div>
</button>

<button class="menu-btn" onclick="papas()">
<img src="https://images.unsplash.com/photo-1573080496219-bb080dd4f877?q=80&w=1200&auto=format&fit=crop">
<div class="menu-text papas">🍟 Papas y banderillas</div>
</button>

<button class="menu-btn" onclick="hamb()">
<img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?q=80&w=1200&auto=format&fit=crop">
<div class="menu-text hamb">🍔 Hamburguesas</div>
</button>

<button class="menu-btn" onclick="hot()">
<img src="https://images.unsplash.com/photo-1612392062798-2f8dfe3f5f5f?q=80&w=1200&auto=format&fit=crop">
<div class="menu-text hot">🌭 Hot Dogs</div>
</button>

<button class="menu-btn" onclick="frap()">
<img src="https://images.unsplash.com/photo-1572490122747-3968b75cc699?q=80&w=1200&auto=format&fit=crop">
<div class="menu-text frap">🥤 Frappés</div>
</button>

<div class="card">

<h2>🛒 Tu pedido</h2>

<div id="carrito"></div>

<div class="total" id="total">
Total: $0
</div>

<button class="enviar" onclick="enviar()">
📲 Enviar pedido
</button>

<button class="eliminar" onclick="eliminar()">
❌ Eliminar seleccionado
</button>

<button class="vaciar" onclick="vaciar()">
🗑 Vaciar carrito
</button>

</div>

</div>

<div id="modal" class="modal">
<div class="modal-content">

<div class="top">
<button onclick="back()">⬅️</button>
<button onclick="cerrar()">❌</button>
</div>

<h2 id="titulo"></h2>

<div id="ops"></div>

<button class="enviar" onclick="next()">
Siguiente ➡️
</button>

</div>
</div>

<div class="toast" id="toast"></div>

<a class="whatsapp" href="#">
💬
</a>

<script>

let carrito=JSON.parse(localStorage.getItem("carrito")) || [];

let seleccionado=null;

let paso=0;

let flujo=[];

let data={};

let maxSel=null;

render();

function toast(msg){

let t=document.getElementById("toast");

t.innerText=msg;

t.style.display="block";

setTimeout(()=>{
t.style.display="none";
},2500);

}

function sonido(){

let audio=new Audio("https://cdn.pixabay.com/download/audio/2022/03/15/audio_115b9b2f39.mp3");

audio.volume=0.3;

audio.play();

}

function render(){

let div=document.getElementById("carrito");

div.innerHTML="";

let total=0;

carrito.forEach((i,idx)=>{

div.innerHTML+=`
<div class="item ${seleccionado===idx?'selected':''}" onclick="seleccionar(${idx})">
${i.nombre.replace(/\n/g,"<br>")}
</div>
`;

total+=i.precio;

});

document.getElementById("total").innerText="Total: $"+total;

}

function seleccionar(i){

seleccionado=i;

render();

}

function eliminar(){

if(seleccionado!=null){

carrito.splice(seleccionado,1);

localStorage.setItem("carrito",JSON.stringify(carrito));

seleccionado=null;

render();

toast("❌ Producto eliminado");

}

}

function vaciar(){

carrito=[];

localStorage.removeItem("carrito");

render();

toast("🗑 Carrito vaciado");

}

function totalCarrito(){

return carrito.reduce((a,b)=>a+b.precio,0);

}

function add(txt,precio){

carrito.push({
nombre:txt,
precio
});

localStorage.setItem("carrito",JSON.stringify(carrito));

render();

sonido();

toast("✅ Producto agregado");

}

function abrir(titulo,ops,tipo,max=null){

document.getElementById("titulo").innerText=titulo;

maxSel=max;

let html="";

ops.forEach(o=>{

html+=`
<label>
<input type="${tipo}" name="opcion" value="${o}" onclick="control(this)">
${o}
</label>
`;

});

document.getElementById("ops").innerHTML=html;

}

function setCategoria(){

document.getElementById("modal").style.display="block";

}

function cerrar(){

document.getElementById("modal").style.display="none";

}

function back(){

if(paso>0){

paso--;

flujo[paso]();

}

}

function getSel(){

return [...document.querySelectorAll("#ops input:checked")].map(i=>i.value);

}

function control(input){

let checks=document.querySelectorAll("#ops input");

if(
input.value==="Ninguna" ||
input.value==="Ninguno" ||
input.value==="Con Todo"
){

if(input.checked){

checks.forEach(c=>{

if(c!==input){
c.checked=false;
}

});

}

}else{

checks.forEach(c=>{

if(
c.value==="Ninguna" ||
c.value==="Ninguno" ||
c.value==="Con Todo"
){
c.checked=false;
}

});

}

if(maxSel && getSel().length>maxSel){

input.checked=false;

toast("⚠️ Máximo "+maxSel+" opciones");

}

}

function next(){

let sel=getSel();

if(!sel.length){

toast("⚠️ Selecciona una opción");

return;

}

data[flujo[paso].key]=sel;

paso++;

if(paso<flujo.length){

flujo[paso]();

}else{

cerrar();

flujo.fin();

}

}

async function obtenerUbicacionActual(){

if(!navigator.geolocation){

throw "Ubicación no disponible";

}

return new Promise((resolve,reject)=>{

navigator.geolocation.getCurrentPosition(

(pos)=>{

let lat=pos.coords.latitude;

let lon=pos.coords.longitude;

resolve({
link:`https://www.google.com/maps?q=${lat},${lon}`
});

},

(err)=>{

reject(err);

},

{
enableHighAccuracy:true,
timeout:20000,
maximumAge:0
}

);

});

}

/* CREPAS */

function crepas(){

setCategoria();

paso=0;

data={};

flujo=[

()=>abrir("Base",["Nutella","Lechera","Cajeta"],"checkbox",2),

()=>abrir("Frutas",["Fresa","Plátano","Durazno","Ninguna"],"checkbox"),

()=>abrir("Toppings",["Chocolate","Nuez","Lunetas","Ninguno"],"radio")

];

flujo[0].key="base";

flujo[1].key="fruta";

flujo[2].key="top";

flujo.fin=function(){

let precio=45;

let txt="🥞 Crepa";

txt+="\nBase: "+data.base.join(", ");

if(!data.fruta.includes("Ninguna")){
txt+="\nFrutas: "+data.fruta.join(", ");
}

if(!data.top.includes("Ninguno")){
txt+="\nTopping: "+data.top.join(", ");
}

txt+="\nPrecio: $"+precio;

add(txt,precio);

};

flujo[0]();

}

/* PLATANOS */

function platanos(){

setCategoria();

paso=0;

data={};

flujo=[

()=>abrir("Tipo",["Fritos $30","Árabes $40"],"radio"),

()=>abrir("Complementos",["Lechera","Crema","Chocolate","Ninguna"],"checkbox")

];

flujo[0].key="tipo";

flujo[1].key="comp";

flujo.fin=function(){

let precio=parseInt(data.tipo[0].match(/\d+/)[0]);

let txt="🍌 Plátanos "+data.tipo[0];

if(!data.comp.includes("Ninguna")){
txt+="\nComplementos: "+data.comp.join(", ");
}

txt+="\nPrecio: $"+precio;

add(txt,precio);

};

flujo[0]();

}

/* PAPAS */

function papas(){

setCategoria();

paso=0;

data={};

flujo=[

()=>abrir("Tipo",["Papas $35","Salchipulpos $45","Banderilla $25"],"radio"),

()=>abrir("Aderezos",["Catsup","Queso","Salsa","Ninguna"],"checkbox")

];

flujo[0].key="tipo";

flujo[1].key="ad";

flujo.fin=function(){

let precio=parseInt(data.tipo[0].match(/\d+/)[0]);

let txt="🍟 "+data.tipo[0];

if(!data.ad.includes("Ninguna")){
txt+="\nAderezos: "+data.ad.join(", ");
}

txt+="\nPrecio: $"+precio;

add(txt,precio);

};

flujo[0]();

}

/* HAMBURGUESAS */

function hamb(){

setCategoria();

paso=0;

data={};

flujo=[

()=>abrir("Hamburguesa",["Clásica $55","Hawaiana $60","Especial $65"],"radio"),

()=>abrir("Extras",["Piña $8","Tocino $8","Carne $10","Ninguna"],"checkbox")

];

flujo[0].key="tipo";

flujo[1].key="extra";

flujo.fin=function(){

let precio=parseInt(data.tipo[0].match(/\d+/)[0]);

if(!data.extra.includes("Ninguna")){

data.extra.forEach(e=>{

precio+=parseInt(e.match(/\d+/)[0]);

});

}

let txt="🍔 "+data.tipo[0];

if(!data.extra.includes("Ninguna")){
txt+="\nExtras: "+data.extra.join(", ");
}

txt+="\nPrecio: $"+precio;

add(txt,precio);

};

flujo[0]();

}

/* HOT DOGS */

function hot(){

setCategoria();

paso=0;

data={};

flujo=[

()=>abrir("Tipo",["Sencillo $20","Especial $25"],"radio"),

()=>abrir("Cantidad",["1","2","3"],"radio")

];

flujo[0].key="tipo";

flujo[1].key="cant";

flujo.fin=function(){

let base=parseInt(data.tipo[0].match(/\d+/)[0]);

let cant=parseInt(data.cant[0]);

let precio=base*cant;

let txt=`🌭 Hot Dog x${cant}`;

txt+="\nTipo: "+data.tipo[0];

txt+="\nPrecio: $"+precio;

add(txt,precio);

};

flujo[0]();

}

/* FRAPPES */

function frap(){

setCategoria();

paso=0;

data={};

flujo=[

()=>abrir("Sabor",["Oreo","Mazapán","Fresa","Frapuccino"],"radio"),

()=>abrir("Tamaño",["Chico $30","Grande $50"],"radio")

];

flujo[0].key="tipo";

flujo[1].key="tam";

flujo.fin=function(){

let precio=parseInt(data.tam[0].match(/\d+/)[0]);

let txt="🥤 Frappé "+data.tipo[0];

txt+="\n"+data.tam[0];

txt+="\nPrecio: $"+precio;

add(txt,precio);

};

flujo[0]();

}

/* ENVIAR */

async function enviar(){

if(carrito.length===0){

toast("⚠️ Agrega productos");

return;

}

let nombre=document.getElementById("nombreCliente").value.trim();

if(nombre===""){

toast("⚠️ Escribe tu nombre");

return;

}

let entrega=document.getElementById("tipoEntrega").value;

let pago=document.getElementById("pago").value;

let total=totalCarrito();

if(entrega==="A domicilio" && total<100){

toast("🛵 Mínimo $100 para envío");

return;

}

let txt="🧾 PEDIDO EL MICHI 🐱\n\n";

txt+="👤 Cliente: "+nombre+"\n";

txt+="🚚 "+entrega+"\n";

txt+="💳 "+pago+"\n\n";

carrito.forEach(i=>{

txt+=i.nombre+"\n\n";

});

if(entrega==="A domicilio"){

try{

document.getElementById("estadoUbicacion").innerText="📍 Obteniendo ubicación...";

let ubicacion=await obtenerUbicacionActual();

txt+="📍 Ubicación:\n"+ubicacion.link+"\n\n";

document.getElementById("estadoUbicacion").innerText="✅ Ubicación agregada";

}catch{

toast("⚠️ Debes permitir ubicación");

return;

}

}

if(pago==="Transferencia"){

txt+="🏦 Paga por transferencia y envía comprobante\n\n";

}

txt+="💰 TOTAL: $"+total;

let telefono="525532416109";

let mensaje=encodeURIComponent(txt);

window.location.href="https://wa.me/"+telefono+"?text="+mensaje;

carrito=[];

localStorage.removeItem("carrito");

render();

toast("✅ Pedido enviado");

}

</script>

</body>
</html>
